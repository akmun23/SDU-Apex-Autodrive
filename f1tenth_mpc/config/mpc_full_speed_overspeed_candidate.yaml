/**:
  ros__parameters:
    # Practice weight trial: increase lateral-position priority after the
    # uncapped 3000/750 + slew run missed the tight-turn corridor by ~5 cm.
    # This is paired with strong input-slew penalties to avoid the earlier
    # full-left/full-right steering oscillation seen without slew regularization.
    weight_e_y: 4000.0
    # The terminal stage-1 failure still had +0.27 rad heading error while
    # steering saturated left; raise heading priority to start this correction
    # earlier in the approach rather than asking for more peak steering.
    weight_e_psi: 1500.0
    # Track the native speed profile while making overspeed substantially more
    # expensive; the last uncapped bag commanded full throttle at 5.36 m/s
    # against a 3.70 m/s reference before lateral error grew to 0.96 m.
    weight_u: 7.5
    weight_u_overspeed: 15.0
    # Source-bag failure showed adjacent full-left/full-right targets at
    # 25 ms spacing. This stronger rate cost is the exact profile that passed
    # held-out practice command-time state replay (157/157 states).
    weight_steering_slew: 2000.0
    weight_throttle_slew: 100.0
    # The initial state is stationary at a native profile target near 5 m/s.
    # This seeds the nominal only; exact nonlinear rollout still gates output.
    startup_nominal_throttle_seed: 0.25
    startup_ramp_laps: 0.0
