/**:
  ros__parameters:
    # Keep development on the same <20 ms end-to-end compute envelope as the
    # deployed controller. The 3.5 ms post-solve reserve remains in the RTI
    # cycle; command-start prediction lateness is diagnostic, not a rejection.
    rti_cycle_budget_ms: 22.0
    end_to_end_cycle_budget_ms: 20.0
    max_command_start_lateness_ms: 2.0
    initial_command_publication_lead_ms: 15.0
    # Exact replay of all 107 command-time snapshots from the Oct 21 watched
    # practice capture passed nonlinear rollout/corridor validation at 0.07;
    # the hardest snapshot converged in 15 iterations. Keep the live trial
    # bounded at 100 iterations and retain exact nonlinear acceptance.
    max_solver_iterations: 100
    solver_tolerance: 0.07
    admm_rho_input: 127.0
    admm_rho_max: 127.0
    # On the exact failed production startup snapshot, a 0.25 nominal drive
    # seed changed the first QP from 100-iteration residual 0.0824/reject to
    # one-iteration residual 0.00028/exact-accepted. It seeds the nominal only;
    # the optimized command still obeys its slew cost, positive-drive bound,
    # and full nonlinear rollout/corridor acceptance.
    startup_nominal_throttle_seed: 0.25
    # A first-fault practice capture exhausted 200 iterations at alpha=1.6
    # with primal residual 0.0558 (tol 0.05). Exact saved-state replay at
    # alpha=1.8 passed the same three samples, but a broader 748-state replay
    # did not improve overall acceptance. Keep this as a targeted live
    # startup experiment only; production remains alpha=1.6.
    admm_over_relaxation: 1.8
    # On 157 exact command-time states from the watched practice capture,
    # steering/throttle slew 2000/100 passed all nonlinear rollout and
    # corridor checks with this 100-iteration cap; maximum replay effort was
    # 74 iterations and 10.1 ms. The 5000/50 and 5000/100 profiles did not.
    # This is a live development candidate, not yet a production default.
    weight_steering_slew: 2000.0
    weight_throttle_slew: 100.0
    # Run closed-loop MPC for the lap; the separate one-shot horizon mode is
    # disabled so it cannot freeze replanning after 30 commands.
    open_loop_horizon_test_enabled: false
    open_loop_horizon_test_min_speed_mps: 4.0
    # On the five exact command-time states captured in the readiness run,
    # clearing only ADMM's stale primal/dual iterate retained the shifted
    # nonlinear nominal and reduced replay iterations 120/11/11/16/12 to
    # 120/1/1/1/1; all five candidates passed exact nonlinear validation.
    # This is a development hypothesis until repeated by a live practice run.
    solver_cold_start_each_solve: true
