/**:
  ros__parameters:
    # Match the Y1 surface blend used by the converged R04 optimizer candidate.
    # This scales the empirical steady-response correction only. The optimizer
    # candidate uses the base 15 ms yaw response and does not model the
    # runtime-only hold-phase time constant, so disable that term here to keep
    # the candidate's prediction model matched to the generated raceline.
    yaw_rate_response_surface_response_scale: 0.25
    yaw_rate_response_surface_hold_time_constant_s: 0.0
    yaw_rate_response_surface_hold_rate_full_radps: 0.0
    yaw_rate_response_surface_hold_rate_zero_radps: 0.0
