mpc_controller_node:
  ros__parameters:
    # This remains false until the observable source-command stage map passes
    # the legal-state N30 gate. The node stays launchable and publishes only
    # safe stops while inhibited.
    enabled: false
    odom_topic: /odom
    pose_topic: /current_map_pose
    command_topic: /cmd/speed
    path_frame: map
    command_frame: base_link
    trajectory_file: ""
    max_speed_mps: 16.0
    startup_speed_mps: 1.5
    startup_ramp_laps: 1.0
    pose_timeout_s: 0.30
    source_dt_min_s: 0.015
    source_dt_max_s: 0.035
    startup_path_max_distance_m: 0.80
    startup_path_heading_tolerance_rad: 0.75
