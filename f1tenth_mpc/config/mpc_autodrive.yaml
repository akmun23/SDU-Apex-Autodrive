/**:
  ros__parameters:
    # The unified development launcher overrides enabled=true for MPC
    # authority. Keeping this false protects direct component composition from
    # accidentally publishing commands before its launch contract is set.
    enabled: false
    shadow_mode: false
    odom_topic: /odom
    pose_topic: /current_map_pose
    command_topic: /cmd/speed
    diagnostics_topic: /mpc/diagnostics
    # Full N30 diagnostics add JSON serialization and DDS work every 25 ms.
    # Authority runs enable this explicitly only when collecting diagnostics.
    publish_diagnostics: false
    path_frame: map
    command_frame: base_link
    trajectory_file: ""

    # Operational command policy and first-lap ramp (only used with authority).
    max_speed_mps: 16.0
    startup_speed_mps: 1.5
    startup_ramp_laps: 1.0

    # Source-time synchronization: retain measured source dt; never synthesize
    # nominal intervals. These are age/skew bounds, not timestamp corrections.
    state_extrapolation_max_s: 0.12
    # Promoted offline against the untouched PP holdout; only legal ROS state
    # and past/current /cmd/speed commands are consumed at runtime.
    control_time_predictor_mode: ct2
    # Experimental only. The legal runtime has no applied-command sequence or
    # steering feedback, and shifting the whole command history by the
    # measured bridge backlog produced discontinuous authority commands in
    # live replay. Keep this disabled until a causal queue model is validated.
    command_actuation_delay_s: 0.0
    # Causal hidden Unity steering-state model.  The physical steering angle
    # follows the published target after approximately two 25 ms command
    # intervals, identified from a live MPC-authority trace.
    physical_steering_delay_s: 0.05
    pose_odom_max_skew_s: 0.12
    source_dt_min_s: 0.001
    source_dt_max_s: 0.250
    startup_path_max_distance_m: 0.80
    startup_path_heading_tolerance_rad: 0.75

    # Identified Unity command-to-yaw response. The curvature correction is
    # disabled in the production baseline until its live MPC-authority A/B is
    # accepted; it is an explicit simulator response term, not a tire model.
    yaw_rate_response_time_constant_s: 0.087735
    yaw_rate_steering_gain_per_m: 3.011897
    yaw_rate_curvature_gain_reduction_per_m: 0.0
    yaw_rate_curvature_gain_start_per_m: 0.20
    yaw_rate_curvature_gain_end_per_m: 0.40
    # Disabled in production.  Offline legal-sensor fitting found a possible
    # slower low-speed yaw response; promote only after a closed-loop MPC
    # authority A/B, never from fixed-trace replay alone.
    yaw_rate_low_speed_response_time_constant_s: 0.0
    yaw_rate_low_speed_transition_speed_mps: 2.0

    # 10-state RTI objective (including Unity's physical steering angle); not
    # promoted from shadow replay. Tune only from
    # closed-loop MPC-authority runs where the car actually follows MPC.
    # Live MPC-authority baseline: 11 post-ramp laps without collision in
    # the ICRA batchmode track run.  The previous 1500/50/200 profile was
    # not the profile that produced the durable result.
    weight_e_y: 125.0
    weight_e_psi: 2.0
    weight_u: 200.0
    weight_u_overspeed: 200.0
    weight_target_speed_state: 20.0
    weight_v: 5.0
    weight_r: 1.5
    weight_steering_command: 3.0
    weight_steering_rate: 5.0
    weight_target_speed_rate: 0.5
    weight_steering_rate_change: 10.0
    weight_target_speed_rate_change: 5.0
    terminal_multiplier: 3.0

    # Simulator command envelope and raceline-corridor safety policy.
    max_steering_rad: 0.5235987756
    max_steering_rate_radps: 3.2
    max_target_speed_rate_increase_mps2: 3.0
    max_target_speed_rate_reduction_mps2: 8.0
    # Raw trajectory wall distances are centerline-to-wall.  The aligned
    # 0.30 m margin is the exact raceline generator's 0.30 m planning
    # footprint half-width plus 0.15 m wall clearance.  MPC adds only the
    # exact heading-dependent rectangle projection using the same geometry.
    corridor_margin_m: 0.30
    first_prediction_corridor_margin_m: 0.30
    corridor_preview_halfwidth_m: 0.10
    nonlinear_corridor_tolerance_m: 0.001

    # Recovery is entered only after the nominal bounded seed violates the
    # normal corridor. Keep nominal parity by default; policy variants are
    # offline-testable and do not relax either actuator envelope.
    recovery_seed_policy: nominal
    recovery_steering_k_e_y: 0.0
    recovery_steering_k_e_psi: 0.0
    recovery_steering_k_r: 0.0

    # Fixed rho reuses the quadratic Riccati factorization once per QP.
    # Adaptive rho is enabled with the existing 100-iteration cap. Penalty
    # changes/refactor cost are diagnostic; timing does not reject candidates.
    admm_rho: 7.0
    admm_rho_input: 7.0
    adaptive_rho: true
    # Strict-gate pre-collision holdout: 1.6 had the best accepted/nonlinear
    # balance among the tested values while retaining the same raw residual
    # gate and 100-iteration cap.
    admm_over_relaxation: 1.6
    # Absolute max raw primal/dual residual; not a relative, state-scaled test.
    solver_tolerance: 0.01
    # Production does not publish a candidate above the normal residual gate.
    # Offline diagnostics may explicitly request a labelled relaxed replay.
    solver_degraded_tolerance: 0.01
    max_solver_iterations: 100
    solver_max_regularization: 0.01
    max_consecutive_degraded_solves: 3
    # Enabled after exact development/holdout replay parity and >2x Riccati
    # solver p95 improvement against the reference implementation.
    use_riccati_prefactorization: true

    # Same-sample RTI refinement. Trigger cutoffs are provisional starting
    # points and must be derived/frozen from dev data, then checked on holdout;
    # no timing budget is used to skip R2 or reject a candidate.
    rti_refinement_mode: adaptive
    rti2_progress_error_trigger_m: 0.10
    rti2_curvature_error_trigger_per_m: 0.02
    rti2_bound_error_trigger_m: 0.05
    rti2_min_corridor_slack_trigger_m: 0.25
    rti2_steering_rate_correction_trigger_radps: 0.50
    rti2_target_speed_rate_correction_trigger_mps2: 1.0
    rti2_residual_imbalance_trigger: 8.0
    rti2_lateral_load_trigger_mps2: 3.0
    rti2_nonsmooth_columns_trigger: 50
    # If R1 reaches the 100-iteration cap with a finite residual above the
    # normal degraded gate, retain it only as an exact nonlinear-checked R2
    # seed when <= this bound. R1-only remains strict; R2 must converge.
    rti2_residual_recovery_limit: 0.25
