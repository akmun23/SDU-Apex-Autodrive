/**:
  ros__parameters:
    # Frozen competition autonomous MPC profile. This file is intentionally
    # complete so the competition image does not depend on a host overlay.
    enabled: true
    odom_topic: /odom
    pose_topic: /current_map_pose
    diagnostics_topic: /mpc/diagnostics
    publish_diagnostics: false
    path_frame: map
    command_frame: base_link
    trajectory_file: ""

    max_speed_mps: 16.0
    startup_speed_mps: 1.5
    # Use the loaded native speed profile immediately; no artificial lap-based
    # speed ramp in the development/competition vehicle model.
    startup_ramp_laps: 0.0

    state_extrapolation_max_s: 0.12
    # A stale sample is never solved against. Keep the last issued command and
    # wait briefly for the packet backlog to recover; only a persistent stale
    # stream latches the controller fault.
    state_stale_fault_grace_s: 0.5
    # Publication lead is model-predicted separately from sensor-state age.
    # 500 ms covers the measured practice solve/publish lead (<400 ms) while
    # remaining inside the offline plant's validated 750 ms prediction span.
    maximum_command_publication_lead_s: 0.5
    command_actuation_delay_s: 0.0
    # Publish only when acquisition, solve, validation and command preparation
    # finish in under 20 ms. Command-start prediction lateness is diagnostic;
    # it does not invalidate an otherwise exact-feasible candidate.
    end_to_end_cycle_budget_ms: 20.0
    max_command_start_lateness_ms: 2.0
    # The Oct 21 practice MPC capture measured 14.2 ms median callback-to-publish.
    initial_command_publication_lead_ms: 15.0
    unity_plant_state_topic: /odom/unity_plant_state
    drive_command_topic: /mpc/drive_command
    pose_odom_max_skew_s: 0.12
    source_dt_min_s: 0.001
    source_dt_max_s: 0.250
    startup_path_max_distance_m: 0.80
    startup_path_heading_tolerance_rad: 0.75

    # Native-speed practice profile: five uncapped laps completed without
    # collision with these weights. The 5.972 s/lap raceline produced measured
    # lap times 6.849, 6.587, 6.410, 6.181, 6.261 s. Higher e_y or lower
    # steering-slew variants were tested and failed earlier; keep this tested
    # profile as the baseline while continuing to reduce its tracking tail.
    weight_e_y: 4000.0
    weight_e_psi: 1500.0
    weight_u: 7.5
    weight_u_overspeed: 60.0
    # Spend more of the existing overspeed penalty in tight bends, where the
    # practice captures showed variable turn-in overspeed and lateral error.
    # The speed-tracking weight while under the reference is unchanged.
    overspeed_curvature_gain_m: 1.0
    # Optional candidate-only schedule: reduce speed-catch-up pressure in
    # tighter turns while retaining the full weight on straights. Zero keeps
    # the validated production objective unchanged.
    underspeed_curvature_gain_m: 0.0
    weight_longitudinal_slip: 25.0
    weight_v: 5.0
    weight_r: 7.8125
    weight_steering_command: 3.0
    weight_steering_target: 5.0
    weight_throttle_command: 0.1
    # Penalizes steering-command changes beyond the path's curvature-derived
    # feedforward change. This keeps steering smooth without fighting a
    # required sign reversal through a curvature transition. The throttle
    # slew cost remains centered on zero command increment.
    weight_steering_slew: 2000.0
    # Restored best repeated profile: the 75.0 run overlay averaged 5.779 s
    # over five scored practice laps; the 100.0 reference averaged 5.785 s.
    weight_throttle_slew: 75.0
    startup_nominal_throttle_seed: 0.25
    terminal_multiplier: 3.0

    max_steering_rad: 0.5235987756
    # Preserve 5 cm physical wall clearance; the vehicle rectangle is projected
    # per predicted heading in the exact rollout and linearized constraints.
    corridor_margin_m: 0.05
    first_prediction_corridor_margin_m: 0.05
    corridor_preview_halfwidth_m: 0.10
    # The .005 m profile completed all ten racing laps below 11 s with no
    # collision. The .010 m trial collided during the opening hairpin.
    nonlinear_corridor_tolerance_m: 0.005

    admm_rho: 7.0
    admm_rho_input: 7.0
    # Bound adaptive penalties: practice captures repeatedly drove rho_u to
    # 127 on iteration-limited solves, with larger dual residuals. Cap at 32.
    admm_rho_max: 32.0
    # Avoid rapid penalty escalation: restrained 1.25x/0.8x updates were
    # retained from the previous high-input-rho practice trial.
    adaptive_rho_update_period: 10
    adaptive_rho: true
    admm_over_relaxation: 1.6
    # Exact coordinate transform for mixed-unit solver state/input channels.
    solver_state_scaling_enabled: true
    # In scaled coordinates, 0.02 is the absolute maximum ADMM residual.
    # Exact nonlinear corridor validation remains a separate hard gate.
    # The exact source-plant rollout and corridor remain independent gates.
    solver_tolerance: 0.02
    # One RTI pass by default, with a single relinearization only after a
    # corridor-invalid QP direction or a zero-step line-search result. The
    # second pass is gated on reserving 9 ms for the deadline and output path.
    # On the 1,127-state v300 practice replay it reduced full-horizon nonlinear
    # rejects from 41 to 28 and increased exact-valid optimal/feasible results;
    # live 20 ms publication timing remains the acceptance gate.
    # Two supervised practice runs with the same trajectory and
    # source plant completed without collision at 150 iterations. The repeat
    # averaged 5.785 s over scored laps (SD 0.105 s), with a 17.029 ms maximum
    # publication gate. Keep the 20 ms deadline gate as the hard runtime bound.
    max_solver_iterations: 150
    # When an exact nonlinear rollout rejects the full QP step, test up to
    # four damped source-plant steps (1/2, 1/4, 1/8, 1/16). Evaluate all
    # feasible trials that fit the deadline and select the lowest production
    # nonlinear objective (clearance breaks numerical ties); retain the exact
    # corridor and command-epoch gates.
    enable_nonlinear_line_search: true
    line_search_max_backtracks: 4
    max_sqp_iterations: 2
    # Disabled: replay showed that full-horizon suffix validation rejects
    # otherwise useful short retained prefixes too often.
    prefer_full_validated_prior_plan_on_rejection: false
    # On a rejected solve, compare candidate and retained-plan actions over
    # the same 75 ms using exact source-plant rollout. Publish the lower-cost
    # prefix only when it passes the corridor check. If both pass, a candidate
    # with measurably better clearance is preferred only when the retained
    # prefix has less than 5 cm of additional corridor slack. This reserve and
    # 5 mm minimum gain target the observed v300 late-turn selection failure;
    # objective selection remains unchanged elsewhere.
    quality_aware_prefix_selection_on_rejection: true
    quality_prefix_clearance_reserve_m: 0.05
    quality_prefix_minimum_clearance_gain_m: 0.005
    # An iteration-limited candidate can replace an exact-valid prior prefix
    # only when both residuals are within 2x solver tolerance, then it must
    # materially improve the exact 75 ms objective (or clear the 5 cm reserve).
    # A better objective from a poor-residual iterate is not trusted: on the
    # 2026-10-25 v300 capture it selected a saturated steering reversal before
    # losing corridor validity on the next cycle.
    quality_prefix_iteration_limited_relative_gain: 0.02
    rti_cycle_budget_ms: 20.0
    # Eight workers improved replay and passed one supervised, 3 m/s practice
    # run (publication-gate max 19.730 ms). Continue supervising until higher-
    # speed runs confirm CPU contention and deadline-tail margin.
    # Zero disables OpenMP parallelism.
    jacobian_threads: 8
