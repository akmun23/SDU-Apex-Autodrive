/**:
  ros__parameters:
    # Frozen competition autonomous MPC profile. This file is intentionally
    # complete so the competition image does not depend on a host overlay.
    enabled: true
    odom_topic: /odom
    pose_topic: /current_map_pose
    diagnostics_topic: /mpc/diagnostics
    publish_diagnostics: false
    path_frame: map
    command_frame: base_link
    trajectory_file: ""

    max_speed_mps: 16.0
    startup_speed_mps: 1.5
    # Use the loaded native speed profile immediately; no artificial lap-based
    # speed ramp in the development/competition vehicle model.
    startup_ramp_laps: 0.0

    state_extrapolation_max_s: 0.12
    # Publication lead is model-predicted separately from sensor-state age.
    # 500 ms covers the measured practice solve/publish lead (<400 ms) while
    # remaining inside the offline plant's validated 750 ms prediction span.
    maximum_command_publication_lead_s: 0.5
    command_actuation_delay_s: 0.0
    # Publish only when acquisition, solve, validation and command preparation
    # finish in under 20 ms. Command-start prediction lateness is diagnostic;
    # it does not invalidate an otherwise exact-feasible candidate.
    end_to_end_cycle_budget_ms: 20.0
    max_command_start_lateness_ms: 2.0
    # The Oct 21 practice MPC capture measured 14.2 ms median callback-to-publish.
    initial_command_publication_lead_ms: 15.0
    unity_plant_state_topic: /odom/unity_plant_state
    drive_command_topic: /mpc/drive_command
    pose_odom_max_skew_s: 0.12
    source_dt_min_s: 0.001
    source_dt_max_s: 0.250
    startup_path_max_distance_m: 0.80
    startup_path_heading_tolerance_rad: 0.75

    # Native-speed practice profile: five uncapped laps completed without
    # collision with these weights. The 5.972 s/lap raceline produced measured
    # lap times 6.849, 6.587, 6.410, 6.181, 6.261 s. Higher e_y or lower
    # steering-slew variants were tested and failed earlier; keep this tested
    # profile as the baseline while continuing to reduce its tracking tail.
    weight_e_y: 4000.0
    weight_e_psi: 1500.0
    weight_u: 7.5
    weight_u_overspeed: 60.0
    weight_longitudinal_slip: 25.0
    weight_v: 5.0
    weight_r: 7.8125
    weight_steering_command: 3.0
    weight_steering_target: 5.0
    weight_throttle_command: 0.1
    # Input-increment regularization from the five-lap profile. Reducing the
    # steering-slew penalty to 1000 caused an immediate high-heading corridor
    # failure; the higher value avoids abrupt reversals.
    weight_steering_slew: 2000.0
    weight_throttle_slew: 10.0
    startup_nominal_throttle_seed: 0.25
    terminal_multiplier: 3.0

    max_steering_rad: 0.5235987756
    # Preserve 5 cm physical wall clearance; the vehicle rectangle is projected
    # per predicted heading in the exact rollout and linearized constraints.
    corridor_margin_m: 0.05
    first_prediction_corridor_margin_m: 0.05
    corridor_preview_halfwidth_m: 0.10
    # The .005 m profile completed all ten racing laps below 11 s with no
    # collision. The .010 m trial collided during the opening hairpin.
    nonlinear_corridor_tolerance_m: 0.005

    admm_rho: 7.0
    admm_rho_input: 7.0
    # Bound adaptive penalties: practice captures repeatedly drove rho_u to
    # 127 on iteration-limited solves, with larger dual residuals. Cap at 32.
    admm_rho_max: 32.0
    # Avoid rapid penalty escalation: restrained 1.25x/0.8x updates were
    # retained from the previous high-input-rho practice trial.
    adaptive_rho_update_period: 10
    adaptive_rho: true
    admm_over_relaxation: 1.6
    # Exact coordinate transform for mixed-unit solver state/input channels.
    solver_state_scaling_enabled: true
    # In scaled coordinates, 0.02 is the absolute maximum ADMM residual.
    # Exact nonlinear corridor validation remains a separate hard gate.
    # The exact source-plant rollout and corridor remain independent gates.
    solver_tolerance: 0.02
    # One QP and one nonlinear validation per 40 Hz cycle; no retry pass.
    # On 174 saved practice states (offline GT-pose isolation), 100 iterations
    # raised exact-feasible candidates from 10/174 to 92/174. With four
    # Jacobian workers the replay p95/max cycle was 11.94/12.98 ms; the live
    # 20 ms RTI deadline remains the hard bound.
    max_solver_iterations: 100
    # Experimental recovery policy: prefer the retained full-plan suffix only
    # when its entire remaining horizon revalidates from the current state.
    # Kept off in the competition baseline pending supervised A/B evidence.
    prefer_full_validated_prior_plan_on_rejection: false
    # Development experiment: when both three-step recovery prefixes pass the
    # exact source-plant/corridor check, select the lower runtime objective.
    # Kept off until a supervised faster-line comparison demonstrates benefit.
    quality_aware_prefix_selection_on_rejection: false
    rti_cycle_budget_ms: 20.0
    # Eight workers improved replay and passed one supervised, 3 m/s practice
    # run (publication-gate max 19.730 ms). Continue supervising until higher-
    # speed runs confirm CPU contention and deadline-tail margin.
    # Zero disables OpenMP parallelism.
    jacobian_threads: 8
