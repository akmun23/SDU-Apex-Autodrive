/**:
  ros__parameters:
    # Frozen competition autonomous MPC profile. This file is intentionally
    # complete so the competition image does not depend on a host overlay.
    enabled: true
    odom_topic: /odom
    pose_topic: /current_map_pose
    diagnostics_topic: /mpc/diagnostics
    publish_diagnostics: false
    path_frame: map
    command_frame: base_link
    trajectory_file: ""

    max_speed_mps: 16.0
    startup_speed_mps: 1.5
    startup_ramp_laps: 1.0

    state_extrapolation_max_s: 0.12
    # Publication lead is model-predicted separately from sensor-state age.
    # 500 ms covers the measured practice solve/publish lead (<400 ms) while
    # remaining inside the offline plant's validated 750 ms prediction span.
    maximum_command_publication_lead_s: 0.5
    command_actuation_delay_s: 0.0
    unity_plant_state_topic: /odom/unity_plant_state
    drive_command_topic: /mpc/drive_command
    pose_odom_max_skew_s: 0.12
    source_dt_min_s: 0.001
    source_dt_max_s: 0.250
    startup_path_max_distance_m: 0.80
    startup_path_heading_tolerance_rad: 0.75

    # A 0.5 m preview maps heading error into lateral displacement, so
    # w_psi = w_y * 0.5^2. A yaw-rate error integrated over 0.5 s produces the
    # same heading error, so w_r = w_psi * 0.5^2.
    weight_e_y: 125.0
    weight_e_psi: 31.25
    # Coordinated profile: strong under-target speed tracking, lower overspeed
    # cost, with light wheel-spin and absolute throttle-effort penalties.
    weight_u: 500.0
    weight_u_overspeed: 300.0
    weight_longitudinal_slip: 5.0
    weight_v: 5.0
    weight_r: 7.8125
    weight_steering_command: 3.0
    weight_steering_target: 5.0
    weight_throttle_command: 0.1
    # Penalize per-cycle command increments; steering smoothness dominates.
    weight_steering_slew: 25.0
    weight_throttle_slew: 2.0
    terminal_multiplier: 3.0

    max_steering_rad: 0.5235987756
    # Preserve 5 cm physical wall clearance; the vehicle rectangle is projected
    # per predicted heading in the exact rollout and linearized constraints.
    corridor_margin_m: 0.05
    first_prediction_corridor_margin_m: 0.05
    corridor_preview_halfwidth_m: 0.10
    # The .005 m profile completed all ten racing laps below 11 s with no
    # collision. The .010 m trial collided during the opening hairpin.
    nonlinear_corridor_tolerance_m: 0.005

    admm_rho: 7.0
    admm_rho_input: 7.0
    # Bound adaptive penalties: practice captures repeatedly drove rho_u to
    # 127 on iteration-limited solves, with larger dual residuals. Cap at 32.
    admm_rho_max: 32.0
    # Avoid rapid penalty escalation: restrained 1.25x/0.8x updates were
    # retained from the previous high-input-rho practice trial.
    adaptive_rho_update_period: 10
    adaptive_rho: true
    admm_over_relaxation: 1.6
    # Exact coordinate transform for mixed-unit solver state/input channels.
    solver_state_scaling_enabled: true
    # In scaled coordinates, 0.02 is the absolute maximum ADMM residual.
    # Exact nonlinear corridor validation remains a separate hard gate.
    # The exact source-plant rollout and corridor remain independent gates.
    solver_tolerance: 0.02
    # One QP and one nonlinear validation per 40 Hz cycle; no retry pass.
    max_solver_iterations: 50
    rti_cycle_budget_ms: 20.0
    # Cap parallel Jacobian construction at four workers so the controller
    # remains deployable on competition PCs with limited CPU availability.
    # Zero disables OpenMP parallelism.
    jacobian_threads: 4
