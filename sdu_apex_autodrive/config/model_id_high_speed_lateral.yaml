# High-speed lateral model-identification campaign.
#
# This is a dev-only open-plane excitation. It uses the existing calibration
# node and the unchanged simulator; no simulator truth is consumed by the
# runtime controller. Ground truth is retained only in the recorded artifact
# for offline scoring.
model_id_excitation:
  ros__parameters:
    mode: identification_grid
    sample_rate_hz: 50.0

    # Keep the longitudinal grid empty: the steering grid below first builds
    # each requested operating-speed regime with a measured feed-forward
    # throttle, then applies signed steering steps at that speed.
    grid_speed_sequence_mps: [0.0]
    grid_base_throttle_sequence: [0.0]
    grid_throttle_sequence: [0.0]
    grid_steering_enabled: true
    grid_steering_speed_sequence_mps: [14.0, 16.0, 18.0, 20.0]
    grid_steering_base_throttle_sequence: [0.60, 0.70, 0.85, 1.00]
    grid_steering_sequence: [0.0, 0.10, -0.10, 0.20, -0.20, 0.0]
    grid_base_hold_sec: 7.0
    grid_steering_hold_sec: 2.5
    grid_step_hold_sec: 1.0
    grid_brake_timeout_sec: 30.0

    zero_settle_sec: 2.0
    throttle_settle_timeout_sec: 20.0
    throttle_settle_stable_sec: 0.75
    throttle_settle_speed_rate_mps2: 0.25
    maximum_test_speed_mps: 22.88
    maximum_throttle: 1.0
    maximum_steering_command: 0.50
    telemetry_timeout_sec: 0.50
    startup_timeout_sec: 30.0
    reset_signal_hold_sec: 0.20
    reset_min_subscribers: 2
    reset_confirmation_timeout_sec: 60.0
    ground_truth_boundary_guard_enabled: true
    ground_truth_boundary_distance_m: 450.0
