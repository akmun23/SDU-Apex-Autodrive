# Diagnostic-only speed-controller validation. The simulator is reset
# manually before launch; this profile isolates closed-loop speed behavior
# from the simulator reset handshake.
calibration:
  ros__parameters:
    mode: speed_steps
    output_dir: /workspace/src/sdu_apex_autodrive/artifacts/calibration/raw/open_scene_speed_controller
    sample_rate_hz: 50.0
    duration_sec: 0.0
    throttle_sequence: [0.0]
    speed_sequence_mps: [5.5, 0.0]
    steering_sequence: [0.0]
    hold_sec: 5.0
    speed_settle_error_mps: 0.25
    speed_settle_timeout_sec: 15.0
    zero_settle_sec: 1.0
    maximum_test_speed_mps: 22.88
    maximum_throttle: 1.0
    maximum_steering_command: 0.50
    telemetry_timeout_sec: 0.75
    startup_timeout_sec: 30.0
    reset_between_steps: false
    reset_pulse_sec: 0.25
