model_id_excitation:
  ros__parameters:
    mode: steering_response
    sample_rate_hz: 50.0
    # Small bounded reversals around the validated low-speed operating point.
    steering_sequence: [0.0, 0.10, 0.0, -0.10, 0.0, 0.25, -0.25, 0.0]
    steering_test_throttle: 0.12
    hold_sec: 2.5
    zero_settle_sec: 1.0
    reset_between_steps: false
    maximum_test_speed_mps: 22.88
    maximum_throttle: 1.0
    maximum_steering_command: 0.50
    telemetry_timeout_sec: 0.50
    startup_timeout_sec: 30.0
    ground_truth_boundary_guard_enabled: false
