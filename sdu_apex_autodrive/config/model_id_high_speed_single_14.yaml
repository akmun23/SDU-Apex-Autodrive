# Single-regime high-speed lateral identification.
#
# This profile deliberately contains no diagnostic reset phases. Each run is
# started with a fresh batchmode Unity player, so the source stream can be
# checked continuously at 40 Hz without reset-induced simulator stalls.
model_id_excitation:
  ros__parameters:
    mode: source_replay
    sample_rate_hz: 50.0
    replay_throttle_sequence: [0.60, 0.60, 0.60, 0.60, 0.60, 0.60, 0.60, 0.60, 0.60]
    replay_steering_sequence: [0.0, 0.0, 0.10, -0.10, 0.20, -0.20, 0.0, 0.0, 0.0]
    replay_phase_steps: [320, 100, 100, 100, 100, 100, 100, 120, 240]
    maximum_test_speed_mps: 22.88
    maximum_throttle: 1.0
    maximum_steering_command: 0.50
    telemetry_timeout_sec: 0.50
    startup_timeout_sec: 30.0
    ground_truth_boundary_guard_enabled: true
    ground_truth_boundary_distance_m: 450.0
    capture_source_events: false
    calibration_record_rate_hz: 10.0
