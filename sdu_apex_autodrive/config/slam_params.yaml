slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: SOFT_L1

    # Mapping-only frame driven by the simulator ground-truth transform.
    # This is never used by the deployed racing localization stack.
    odom_frame: gt_odom
    base_frame: base_link
    map_frame: map
    scan_topic: /autodrive/roboracer_1/lidar
    use_sim_time: false
    mode: mapping

    debug_logging: false
    # One of every two native scans is sufficient with the exact pose and
    # keeps the mapper below its measured processing capacity, avoiding queue
    # drops that would leave holes in the occupancy grid.
    throttle_scans: 2
    transform_publish_period: 0.02
    # Publish the corrected occupancy grid frequently enough that the final
    # loop-closure result is what the map saver serializes.
    map_update_interval: 0.5
    resolution: 0.05
    min_laser_range: 0.06
    max_laser_range: 10.0
    minimum_time_interval: 0.10
    # The source-patched compete scene delivers LiDAR and odometry at 40 Hz;
    # throttle_scans above intentionally feeds every second scan to mapping.
    # The prebuilt compete asset can be slower, so allow normal DDS jitter
    # without accepting a stale TF.
    transform_timeout: 1.0
    tf_buffer_duration: 120.0
    enable_interactive_mode: false

    # Ground-truth mapping already supplies the globally correct pose. The
    # previous scan matcher was free to perturb those poses and produced
    # duplicated wall layers over repeated laps. Use the exact pose directly.
    use_scan_matching: false
    use_scan_barycenter: false
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.010
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.15
    link_scan_maximum_distance: 1.5
    # Five laps can accumulate more than 2 m of dead-reckoning error before
    # the first reliable return. Use the standard search envelope and let the
    # scan response, not odometry alone, decide the loop match.
    loop_search_maximum_distance: 3.0
    # Loop closure is unnecessary with the same simulator world pose for
    # every scan and can introduce a second inconsistent correction source.
    do_loop_closing: false
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.10
