model_id_excitation:
  ros__parameters:
    mode: identification_grid
    sample_rate_hz: 50.0
    # ROS 2 does not initialize an array parameter from an empty YAML list;
    # keep one neutral point so the steering-only run can declare the native
    # grid parameters without adding a meaningful throttle experiment.
    grid_speed_sequence_mps: [0.0]
    grid_base_throttle_sequence: [0.0]
    grid_throttle_sequence: [0.0]
    grid_steering_enabled: true
    grid_steering_speed_sequence_mps: [3.0]
    grid_steering_base_throttle_sequence: [0.12]
    grid_steering_sequence: [-0.35, 0.35, 0.0]
    grid_steering_hold_sec: 1.5
    # Current run configuration: repeat nominal steering regime.
    steering_test_throttle: 0.12
    grid_base_hold_sec: 1.0
    grid_step_hold_sec: 1.0
    hold_sec: 2.0
    zero_settle_sec: 2.0
    grid_brake_timeout_sec: 6.0
    zero_settle_sec: 1.0
    # At the 0.12 base throttle the measured source trajectory approaches
    # 3 m/s with a residual acceleration of about 0.20 m/s^2.  Use a small
    # measured tolerance margin and allow that transient to finish; this is
    # a calibration gate, not a simulator or vehicle-physics change.
    throttle_settle_speed_rate_mps2: 0.50
    throttle_settle_stable_sec: 0.50
    throttle_settle_timeout_sec: 20.0
    maximum_test_speed_mps: 22.88
    maximum_throttle: 1.0
    maximum_steering_command: 0.50
    telemetry_timeout_sec: 0.50
    startup_timeout_sec: 30.0
    reset_signal_hold_sec: 0.20
    reset_min_subscribers: 2
    reset_zero_odom_stable_sec: 0.75
    reset_confirmation_timeout_sec: 20.0
    ground_truth_boundary_distance_m: 450.0
