ftg_node:
  ros__parameters:
    # Fast mapping profile. Choose the largest usable gap; a close wall can
    # be the inside of a viable bend, so mapping must not force a turn away
    # from it before the selected gap is known.
    # Mapping must finish in a useful time while retaining the close-wall
    # recovery and emergency-stop limits below.  Recovery uses this floor;
    # the map is rejected if the faster profile cannot complete a clean lap.
    max_speed: 2.00
    min_speed: 0.25
    speed_full_range: 3.00
    steering_gain: 3.20
    target_ema_alpha: 0.55
    heading_weight: 0.15
    # Prefer the widest continuous traversable opening.  A high power here
    # overvalues a distant return beam at the ambiguous inner corner and can
    # select the wrong branch even when the usable corridor is wider.
    score_power: 1.0
    clearance_cone_scale: 1.0
    min_score_range: 0.35
    select_single_gap: true
    avoid_close_side: false
    close_side_turn_angle: 0.28
    gap_switch_confirm_cycles: 20
    emergency_brake_distance: 0.15
    footprint_clearance: 0.06
    # Mapping-only swept-envelope margin. The physical car remains unchanged;
    # FTG rejects gaps that are too tight for its front/side corner to clear.
    virtual_width_inflation: 0.10
    virtual_front_inflation: 0.20
    virtual_rear_inflation: 0.04
    # Recovery is a near-obstacle guard, not a corridor-following mode.  Start
    # at the inflated front envelope so a stale full-lock gap command can be
    # turned away before the hard obstacle threshold is reached.
    # Start the turn-away before the corner reaches the physical envelope and
    # keep the selected side latched until the car has visibly cleared it.
    side_recovery_distance: 0.90
    side_recovery_max_angle: 1.50
    # At the previous 0.75 m trigger the 0.20 rad command was too weak: the
    # car reached 0.264 m before full lock could take effect. Start the
    # turn-away earlier and reach full authority before the physical corner
    # envelope is entered.
    # Turn away early enough for the vehicle to build lateral displacement
    # before a side wall becomes a near-front corner.
    side_recovery_min_steering: 0.42
    side_recovery_full_steering_distance: 0.85
    # Require a sustained opposite-side observation before changing turn
    # direction; this prevents a single corner scan from reversing the car.
    recovery_switch_confirm_cycles: 10
    recovery_clear_confirm_cycles: 8
    lock_recovery_side_until_clear: false
    # At the track's front-facing ambiguous corner, commit to the left-hand
    # opening before the nearest beam crosses sides.
    ambiguous_front_recovery_sign: 1.0
    use_rear_context: true
    wall_margin: 0.03
    side_safety_margin: 0.04
    max_disparity_extension_angle: 0.55
    steer_slowdown_gain: 1.0
