# Diagnostics-only high-range open-ground characterization. Longer holds are
# used here because high throttle produces wheel slip and needs time to expose
# the body-speed response. Ground truth remains offline-only.
calibration:
  ros__parameters:
    mode: throttle_steps
    output_dir: /workspace/src/sdu_apex_autodrive/artifacts/calibration/raw/open_scene_high_range
    sample_rate_hz: 50.0
    duration_sec: 0.0
    throttle_sequence: [0.30, 0.40, 0.50, 0.60, 0.70, 0.80, 1.00]
    speed_sequence_mps: [0.0]
    steering_sequence: [0.0]
    hold_sec: 5.0
    zero_settle_sec: 3.0
    maximum_test_speed_mps: 22.88
    maximum_throttle: 1.0
    maximum_steering_command: 0.50
    telemetry_timeout_sec: 0.75
    startup_timeout_sec: 30.0
    reset_between_steps: true
    reset_pulse_sec: 0.25
