ftg_node:
  ros__parameters:
    # Validation profile for the improved turn-anticipating FTG controller.
    max_speed: 2.00
    # Keep clear-space driving capable of reaching 2 m/s, but use a slower
    # crawl floor whenever the swept-envelope recovery is active.
    min_speed: 0.12
    # Keep the 2 m/s ceiling, but reserve more distance for an unseen
    # corner: the previous 2 m range allowed about 1.6 m/s before a blind
    # inner wall appeared inside the steering envelope.
    speed_full_range: 3.00
    steering_gain: 3.20
    target_ema_alpha: 0.45
    heading_weight: 0.15
    score_power: 1.0
    clearance_cone_scale: 1.0
    min_score_range: 0.35
    select_single_gap: true
    avoid_close_side: false
    close_side_turn_angle: 0.28
    gap_switch_confirm_cycles: 20
    # The physical car's swept footprint is already inside the old 0.15 m
    # point threshold at the ambiguous inner corner.  Brake at the first
    # reliable close return while retaining escape steering in FTG.
    emergency_brake_distance: 0.35
    # Keep a small crawl while the car rotates away; a stationary car cannot
    # change heading and otherwise remains trapped at the hard-stop point.
    emergency_rolling_speed: 0.12
    footprint_clearance: 0.06
    virtual_width_inflation: 0.10
    virtual_front_inflation: 0.20
    virtual_rear_inflation: 0.04
    # Commit to the left opening through the ambiguous unexplored front
    # corner. The previous right turn entered a dead-end and retraced the
    # outgoing corridor instead of covering the remaining track.
    # Commit before the inner wall reaches the swept envelope. The previous
    # 1.05 m trigger allowed the car to enter the bend before full steering.
    side_recovery_distance: 1.45
    side_recovery_max_angle: 1.50
    # Turn away early enough for the vehicle to build lateral displacement
    # before a side wall becomes a near-front corner.
    side_recovery_min_steering: 0.50
    side_recovery_full_steering_distance: 1.20
    # Permit a genuine initial turn-side change, but require a sustained
    # opposite-side observation so a transient inner-corner beam cannot flip
    # the command while the car is already committed to the bend.
    recovery_switch_confirm_cycles: 60
    recovery_clear_confirm_cycles: 20
    # Do not reverse the escape side while the vehicle is still inside this
    # corner. A side change is allowed only after the recovery envelope clears.
    lock_recovery_side_until_clear: true
    ambiguous_front_recovery_sign: 1.0
    use_rear_context: true
    wall_margin: 0.03
    side_safety_margin: 0.04
    max_disparity_extension_angle: 0.55
    steer_slowdown_gain: 1.0
