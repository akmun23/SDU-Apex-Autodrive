# Diagnostics-only open-ground throttle x operating-speed identification.
# Ground truth is recorded by calibration.py and is never read by runtime
# control or localization nodes.
calibration:
  ros__parameters:
    mode: throttle_speed_grid
    output_dir: /workspace/src/sdu_apex_autodrive/artifacts/calibration/raw/open_scene_throttle_speed_grid
    sample_rate_hz: 50.0
    duration_sec: 0.0
    grid_speed_sequence_mps: [0.0, 3.0, 6.0, 9.0, 12.0]
    # These are only open-ground re-entry commands. The recorder labels the
    # requested operating speed, while analysis uses the actual GT speed.
    grid_base_throttle_sequence: [0.0, 0.08, 0.18, 0.30, 0.50]
    grid_throttle_sequence: [0.0, 0.05, 0.10, 0.15, 0.20, 0.30, 0.40, 0.50, 0.60, 0.80, 1.0]
    grid_base_hold_sec: 2.0
    grid_step_hold_sec: 1.5
    steering_sequence: [0.0]
    hold_sec: 1.5
    zero_settle_sec: 3.0
    # This guard observes local encoder odometry, which can exceed body speed
    # under wheel slip. Keep it above the diagnostic wheel-spin envelope so
    # the full throttle grid is not aborted by the quantity being measured.
    maximum_test_speed_mps: 100.0
    maximum_throttle: 1.0
    maximum_steering_command: 1.0
    telemetry_timeout_sec: 0.75
    startup_timeout_sec: 30.0
    reset_between_steps: true
    reset_pulse_sec: 0.25
