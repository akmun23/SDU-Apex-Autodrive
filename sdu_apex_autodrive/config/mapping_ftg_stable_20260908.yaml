ftg_node:
  ros__parameters:
    # Mapping validation profile: ordinary forward FTG on a circular track.
    # No raceline and no global exploration bias are used.
    max_speed: 0.60
    min_speed: 0.15
    speed_full_range: 1.50
    steering_gain: 3.20
    # Turn-in must not wait for a long confirmation window at this track's
    # first bend. The safety envelope still bounds the result.
    target_ema_alpha: 0.90
    heading_weight: 0.10
    score_power: 2.0
    clearance_cone_scale: 1.0
    min_score_range: 0.35
    select_single_gap: true
    avoid_close_side: false
    close_side_turn_angle: 0.22
    gap_switch_confirm_cycles: 2

    emergency_brake_distance: 0.15
    # A hard stop with zero speed cannot change the Ackermann heading. Keep a
    # small crawl while full escape steering is applied; the collision
    # monitor still aborts the run if the car actually touches the boundary.
    emergency_rolling_speed: 0.12
    footprint_clearance: 0.04
    virtual_width_inflation: 0.04
    virtual_front_inflation: 0.08
    virtual_rear_inflation: 0.02
    # A side wall is normally the inside boundary of a bend. Only a return in
    # the front 0.60 rad may override the selected gap and turn away.
    side_recovery_distance: 0.90
    side_recovery_max_angle: 1.20
    side_recovery_front_angle: 0.55
    side_recovery_min_steering: 0.40
    side_recovery_full_steering_distance: 0.65
    recovery_switch_confirm_cycles: 8
    recovery_clear_confirm_cycles: 12
    lock_recovery_side_until_clear: true
    recovery_override_selected_gap: true
    # The right-hand choice was a dead-end U-turn on this track. Commit to
    # the unexplored left opening at the ambiguous front corner.
    ambiguous_front_recovery_sign: 1.0
    use_rear_context: true
    emergency_prefer_last_steering: true

    wall_margin: 0.02
    side_safety_margin: 0.04
    disparity_threshold: 0.45
    max_disparity_extension_angle: 0.40
    steer_slowdown_gain: 1.0

    # Explicitly disabled for this test: a circular track should be traversed
    # by the local controller alone. The optional mapping memory remains
    # available for later branch/frontier experiments.
