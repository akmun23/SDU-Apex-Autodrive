five_lap_map_saver:
  ros__parameters:
    odom_topic: /autodrive/roboracer_1/odom
    save_map_service: /slam_toolbox/save_map
    completion_topic: /sdu/mapping_complete
    output_directory: /workspace/src/f1tenth_planning/maps
    map_name: ftg_test_one_lap_2mps_recovery035_full_20260908
    target_laps: 1
    start_radius_m: 1.0
    departure_radius_m: 1.5
    # Require the observed compete-track-scale traversal before accepting a
    # return to the start. This prevents the 11 m false lap seen in testing.
    minimum_lap_distance_m: 35.0
    start_heading_tolerance_rad: 0.75
    maximum_odom_step_m: 1.0
    settle_before_save_s: 8.0
    stop_before_save: true
