# Closed-loop speed verification with enough dwell time to reach the measured
# simulator body-speed envelope. The earlier 3 s profile was too short for
# the 10-14 m/s points and therefore was not a valid top-speed assessment.
calibration:
  ros__parameters:
    mode: speed_steps
    output_dir: /workspace/src/sdu_apex_autodrive/artifacts/calibration/raw/open_scene_speed_full_envelope
    sample_rate_hz: 50.0
    duration_sec: 0.0
    throttle_sequence: [0.0]
    speed_sequence_mps: [0.0, 4.0, 6.0, 8.0, 10.0, 12.0, 14.0, 16.0, 20.0, 0.0]
    steering_sequence: [0.0]
    hold_sec: 18.0
    zero_settle_sec: 3.0
    maximum_test_speed_mps: 100.0
    maximum_throttle: 1.0
    maximum_steering_command: 0.50
    telemetry_timeout_sec: 0.75
    startup_timeout_sec: 30.0
    reset_between_steps: true
    reset_pulse_sec: 0.25
    reset_confirmation_timeout_sec: 120.0
    reset_zero_odom_stable_sec: 30.0
    ground_truth_boundary_guard_enabled: true
    ground_truth_boundary_distance_m: 450.0
