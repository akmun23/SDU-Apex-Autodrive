# Fresh lateral/yaw identification across the controller's normal speed range.
# Diagnostics-only source replay on the unchanged open-plane Unity player.
# The measured speed, wheel slip, and source timing are evaluated offline.
model_id_excitation:
  ros__parameters:
    mode: source_replay
    sample_rate_hz: 50.0
    # The plateaus are approximate throttle operating points.  The actual
    # speed is always read from the recorded source packet, never commanded as
    # a runtime truth input.  Each plateau contains both signs of steering so
    # yaw/lateral asymmetry and steering reversals are observable.
    replay_throttle_sequence: [
      0.0,
      0.08, 0.08, 0.08, 0.08,
      0.16, 0.16, 0.16, 0.16,
      0.25, 0.25, 0.25, 0.25,
      0.40, 0.40, 0.40, 0.40,
      0.50, 0.50, 0.50, 0.50,
      0.0
    ]
    replay_steering_sequence: [
      0.0,
      0.0, 0.15, 0.0, -0.15,
      0.0, 0.15, 0.0, -0.15,
      0.0, 0.15, 0.0, -0.15,
      0.0, 0.20, 0.0, -0.20,
      0.0, 0.20, 0.0, -0.20,
      0.0
    ]
    replay_phase_steps: [
      40,
      120, 80, 60, 80,
      120, 80, 60, 80,
      120, 80, 60, 80,
      120, 80, 60, 80,
      120, 80, 60, 80,
      200
    ]
    maximum_test_speed_mps: 22.88
    maximum_throttle: 1.0
    maximum_steering_command: 0.50
    telemetry_timeout_sec: 0.50
    startup_timeout_sec: 30.0
    ground_truth_boundary_guard_enabled: true
    ground_truth_boundary_distance_m: 430.0
    capture_source_events: false
    calibration_record_rate_hz: 10.0
