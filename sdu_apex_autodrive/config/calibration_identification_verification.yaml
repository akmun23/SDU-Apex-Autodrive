# One bounded post-fit verification. This is not a second identification grid:
# it checks the promoted encoder slip map at six isolated direct-throttle points.
# Ground truth remains diagnostics-only and is never a runtime input.
calibration:
  ros__parameters:
    mode: identification_grid
    output_dir: /workspace/src/sdu_apex_autodrive/artifacts/calibration/raw/latest_identification_verification_final
    sample_rate_hz: 50.0
    duration_sec: 0.0
    grid_speed_sequence_mps: [0.0]
    grid_base_throttle_sequence: [0.0]
    grid_throttle_sequence: [0.06, 0.20, 0.40, 0.65, 0.80, 1.0]
    grid_base_hold_sec: 1.0
    grid_step_hold_sec: 1.5
    throttle_settle_timeout_sec: 30.0
    throttle_settle_min_sec: 1.5
    throttle_settle_stable_sec: 0.75
    # Require the timestamped simulator truth velocity to be genuinely flat
    # before braking; 0.15 m/s^2 ended the full-throttle phase too early.
    throttle_settle_speed_rate_mps2: 0.05
    grid_brake_timeout_sec: 30.0
    brake_stop_encoder_speed_radps: 0.5
    brake_stop_imu_accel_mps2: 0.25
    brake_stop_imu_yaw_rate_radps: 0.05
    brake_stop_odom_speed_mps: 0.20
    brake_stop_gt_speed_mps: 0.20
    brake_stop_stable_sec: 0.75
    steering_sequence: [0.0]
    hold_sec: 1.5
    zero_settle_sec: 3.0
    encoder_wheel_radius_m: 0.0590
    maximum_test_speed_mps: 30.0
    maximum_throttle: 1.0
    maximum_steering_command: 0.50
    telemetry_timeout_sec: 0.75
    # Allow a cold visible-simulator/bridge startup; this is not a runtime
    # telemetry watchdog. Start the run only after the UI says Connected!.
    startup_timeout_sec: 90.0
    reset_between_steps: true
    reset_pulse_sec: 0.50
    reset_signal_hold_sec: 0.20
    reset_confirmation_timeout_sec: 30.0
    reset_odom_speed_threshold_mps: 0.20
    reset_zero_odom_stable_sec: 2.0
    ground_truth_boundary_guard_enabled: true
    ground_truth_boundary_distance_m: 350.0
