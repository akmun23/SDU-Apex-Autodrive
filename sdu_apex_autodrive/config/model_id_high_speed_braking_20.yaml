# Independent high-speed longitudinal acceleration/coast/braking run.
#
# A fresh model-identification player is used for each run.  There are no
# reset phases: the applied command must remain continuous from acceleration
# into the explicit zero-throttle phase so the transition is causal.
model_id_excitation:
  ros__parameters:
    mode: source_replay
    sample_rate_hz: 50.0
    replay_throttle_sequence: [0.90, 0.0]
    replay_steering_sequence: [0.0, 0.0]
    replay_phase_steps: [420, 480]
    maximum_test_speed_mps: 22.88
    maximum_throttle: 1.0
    maximum_steering_command: 0.50
    telemetry_timeout_sec: 0.50
    startup_timeout_sec: 30.0
    ground_truth_boundary_guard_enabled: true
    ground_truth_boundary_distance_m: 450.0
    capture_source_events: false
    calibration_record_rate_hz: 10.0
