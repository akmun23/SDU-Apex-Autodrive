autodrive_command_adapter:
  ros__parameters:
    input_topic: /cmd/selected
    odom_topic: /autodrive/roboracer_1/odom
    steering_topic: /autodrive/roboracer_1/steering_command
    throttle_topic: /autodrive/roboracer_1/throttle_command
    enable_topic: /autodrive/adapter/enable
    armed_topic: /autodrive/adapter/armed
    enabled_at_startup: false
    command_timeout_sec: 0.25
    odom_timeout_sec: 0.25
    publish_rate_hz: 20.0

    # AutoDRIVE RoboRacer 2026 native interface values.
    max_steering_angle_rad: 0.5236
    steering_command_min: -1.0
    steering_command_max: 1.0
    throttle_command_min: -1.0
    throttle_command_max: 1.0

    # The controller stack requests speed in m/s. This is an operational cap,
    # not the simulator's documented 22.88 m/s physical top speed.
    max_target_speed_mps: 2.5

    # Closed-loop speed-controller tuning. AutoDRIVE has no speed-command topic:
    # normalized throttle is controlled from target speed and odometry feedback.
    speed_feedforward_gain: 0.04
    speed_proportional_gain: 0.02
    speed_integral_gain: 0.005
    speed_integral_limit: 1.0
    maximum_forward_throttle: 0.07
    throttle_rise_rate_per_sec: 0.10
    throttle_fall_rate_per_sec: 0.20
    stop_speed_threshold_mps: 0.01
