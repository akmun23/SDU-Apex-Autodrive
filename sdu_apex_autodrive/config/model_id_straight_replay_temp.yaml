model_id_excitation:
  ros__parameters:
    mode: throttle_steps
    sample_rate_hz: 50.0
    # Repeated straight-line replay for simulator determinism. The phase
    # values are raw normalized throttle commands; steering remains zero.
    throttle_sequence: [0.0, 0.20, 0.40, 0.10, 0.70, 0.0]
    hold_sec: 2.5
    zero_settle_sec: 1.0
    reset_between_steps: false
    maximum_test_speed_mps: 22.88
    maximum_throttle: 1.0
    maximum_steering_command: 0.50
    telemetry_timeout_sec: 0.50
    startup_timeout_sec: 30.0
    ground_truth_boundary_guard_enabled: false
