model_id_excitation:
  ros__parameters:
    mode: source_replay
    sample_rate_hz: 50.0
    # Identical bounded paired throttle+steering sequence for A4. Phase
    # lengths are source packets; the command pair is changed only after the
    # final packet of the preceding phase has been received.
    replay_throttle_sequence: [0.0, 0.20, 0.20, 0.40, 0.40, 0.10, 0.10, 0.70, 0.70, 0.0, 0.0]
    replay_steering_sequence: [0.0, 0.0, 0.10, 0.10, -0.10, -0.10, 0.25, 0.25, -0.25, 0.0, 0.0]
    replay_phase_steps: [40, 100, 100, 100, 100, 100, 100, 100, 100, 100, 40]
    maximum_test_speed_mps: 22.88
    maximum_throttle: 1.0
    maximum_steering_command: 0.50
    telemetry_timeout_sec: 0.50
    startup_timeout_sec: 30.0
    ground_truth_boundary_guard_enabled: false
