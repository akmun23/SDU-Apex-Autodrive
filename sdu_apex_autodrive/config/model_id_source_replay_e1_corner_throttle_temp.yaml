model_id_excitation:
  ros__parameters:
    mode: source_replay
    sample_rate_hz: 50.0
    # E1: throttle increase/decrease while holding a bounded corner.  Every
    # phase length is a count of fresh simulator source packets.
    replay_throttle_sequence: [0.0, 0.25, 0.25, 0.50, 0.25, 0.0, 0.0]
    replay_steering_sequence: [0.0, 0.0, 0.10, 0.10, 0.10, 0.10, 0.0]
    replay_phase_steps: [80, 160, 160, 200, 160, 160, 80]
    maximum_test_speed_mps: 22.88
    maximum_throttle: 1.0
    maximum_steering_command: 0.50
    telemetry_timeout_sec: 0.50
    startup_timeout_sec: 30.0
    ground_truth_boundary_guard_enabled: false
