stage:
  dt_s: 0.025
  state_order: [e_y, e_psi, u, v, r, target_speed, steering_command]
  control_order: [steering_rate, target_speed_rate]
  max_speed_mps: 16.0
  steering_limit_rad: 0.5235987756
  steering_rate_limit_radps: 3.2
  target_speed_rate_min_mps2: -8.0
  target_speed_rate_max_mps2: 3.0
  lateral_velocity_policy: hold_constant_until_identified
  reject_frenet_denominator_abs_below: 0.05
