source_event_stream: ../11_shadow/pp_mpc_shadow_icra_20260918/events.csv.gz
runtime_inputs_only: [/odom, /current_map_pose, /cmd/speed, accepted_raceline]
simulator_truth_used_at_runtime: false
prediction:
  horizon_steps: 30
  dt_s: 0.025
  control_rate_hz: 40
  max_speed_mps: 16.0
solver:
  max_iterations: 100
  adaptive_rho: true
  rho: 7.0
  rho_u: 7.0
  prefactorized: true
  scaling: false
  tolerance: 0.01
  degraded_tolerance: 0.05
refinement:
  mode: adaptive
recovery:
  seed_policy: nominal
  nominal_operation_parity: true
  actuator_bounds_unchanged: true
  temporary_directional_corridor_only: true
  feedback_policies_implemented_but_not_promoted: [heading_feedback, brake_heading_feedback]
amcl:
  large_correction_phase_distance_m: 51.7
  post_phase_max_correction_m: 0.20
  post_phase_max_correction_yaw_rad: 0.12
  uncertain_state_command_policy: hold_last_bounded_driving_command
