schema_version: 4
description: >-
  Canonical open-world IMU/encoder odometry calibration evidence. Ground truth
  is used offline for fitting and scoring only; it is never a runtime input.
repository:
  base_revision: 535adf0
  status_date: 2026-09-05
  scene: official_open_ground_no_track
  simulator_image: autodriveecosystem/autodrive_roboracer_sim:2026-iros-explore
  analyzer: sdu_apex_autodrive/sdu_apex_autodrive/scripts/analyze_calibration.py
  regime_fitter: sdu_apex_autodrive/sdu_apex_autodrive/scripts/fit_regime_sensor_fusion_model.py
fit_policy:
  - Fit only from training_csv.
  - Score only on validation_csv; never mix the files.
  - Use source timestamps and measured callback cadence.
  - Keep encoder freeze and braking slip as valid motion data.
  - Keep simulator truth outside runtime odom, EKF, AMCL, and controllers.

canonical_odometry_csvs:
  training_csv:
    path: raw/identification_grid_full_20260904/identification_grid_20260904_113534.csv
    purpose: model fitting only
    source_events: 63158
    recorder_rows: 457619
    measured_sensor_rate_hz: 39.99
    collisions: 0
  validation_csv:
    path: raw/identification_grid_fusion_candidate_20260904/identification_grid_20260904_123232.csv
    purpose: untouched independent validation only
    source_events: 62829
    recorder_rows: 455089
    measured_sensor_rate_hz: 39.99
    collisions: 0

canonical_fit:
  output_dir: derived/odom_fusion_train_full_holdout_observer_median_20260904
  metrics: derived/odom_fusion_train_full_holdout_observer_median_20260904/metrics.csv
  generated_header: derived/odom_fusion_train_full_holdout_observer_median_20260904/sensor_fusion_model.hpp
  installed_runtime_header: ../../../f1tenth_localization/include/f1tenth_localization/sensor_fusion_model.hpp
  installed_runtime_header_status: unchanged_candidate_not_promoted
  command: >-
    PYTHONPATH=sdu_apex_autodrive python3 -u
    sdu_apex_autodrive/sdu_apex_autodrive/scripts/fit_regime_sensor_fusion_model.py
    raw/identification_grid_full_20260904/identification_grid_20260904_113534.csv
    --validation
    raw/identification_grid_fusion_candidate_20260904/identification_grid_20260904_123232.csv
    --header derived/odom_fusion_train_full_holdout_observer_median_20260904/sensor_fusion_model.hpp
    --metrics derived/odom_fusion_train_full_holdout_observer_median_20260904/metrics.csv

holdout_relative_error_p95_pct:
  all:
    1-3_mps: 2.669
    3-5_mps: 1.801
    5-10_mps: 1.190
    10-15_mps: 0.757
    15-20_mps: 0.476
    20-23_mps: 0.299
  1-3_mps_by_regime:
    accelerating: 3.869
    steady: 0.016
    decelerating: 11.655
    frozen: 2.352
    frozen_accelerating: 4.430

deployed_map_provenance:
  wheel_speed_map: derived/identification_grid_stop_gate_40hz_20260904/wheel_speed_map.csv
  physical_wheel_radius_m: 0.0590
  ground_truth_runtime_input: false

retained_files:
  - raw/identification_grid_full_20260904/identification_grid_20260904_113534.csv
  - raw/identification_grid_fusion_candidate_20260904/identification_grid_20260904_123232.csv
  - derived/odom_fusion_train_full_holdout_observer_median_20260904/metrics.csv
  - derived/odom_fusion_train_full_holdout_observer_median_20260904/sensor_fusion_model.hpp
  - derived/identification_grid_stop_gate_40hz_20260904/wheel_speed_map.csv

deleted_as_superseded:
  - prior identification, speed-controller, acceleration-controller, and
    transient-validation CSV recordings
  - prior derived reports and generated model candidates
  - obsolete fit_sensor_fusion_model.py implementation
  - rejected fit_longitudinal_observer.py implementation and its setup entry
