# mpc_competition.yaml: source-exact full-step nonlinear SQP.
# Physical walls are hard; the configured clearance reserve is restored after disturbances.
/**:
  ros__parameters:
    enabled: true
    odom_topic: /odom
    pose_topic: /current_map_pose
    path_frame: map
    command_frame: base_link
    trajectory_file: ''
    max_speed_mps: 16.0
    startup_speed_mps: 1.5
    startup_ramp_laps: 0.0
    state_extrapolation_max_s: 0.12
    state_stale_fault_grace_s: 0.5
    maximum_command_publication_lead_s: 0.5
    command_actuation_delay_s: 0.0
    end_to_end_cycle_budget_ms: 22.0
    max_command_start_lateness_ms: 2.0
    initial_command_publication_lead_ms: 15.0
    unity_plant_state_topic: /odom/unity_plant_state
    drive_command_topic: /mpc/drive_command
    pose_odom_max_skew_s: 0.12
    startup_path_max_distance_m: 0.8
    startup_path_heading_tolerance_rad: 0.75
    weight_e_y: 5500.0
    weight_e_psi: 2500.0
    weight_u: 50.0
    # Overspeed into a corner forces braking while the front tires are
    # already saturated; the curvature gains weight overspeed, lateral position
    # and heading up where the path turns.
    weight_u_overspeed: 50.0
    overspeed_curvature_gain_m: 1.25
    underspeed_curvature_gain_m: 0.5
    lateral_curvature_gain_m: 0.5
    heading_curvature_gain_m: 0.5
    weight_grip_loss: 200.0
    grip_loss_tolerance: 0.2
    weight_v: 5.0
    weight_r: 7.8125
    weight_steering_command: 3.0
    # No speed envelope: the raceline's own speeds are tracked and the rear-slip
    # penalty and the weights keep the car on the road. Setting
    # curvature_speed_envelope_lateral_accel_mps2 above zero bounds the speeds.
    curvature_speed_envelope_lateral_accel_mps2: 0.0
    weight_steering_target: 0.0
    weight_throttle_command: 0.1
    weight_steering_slew: 500.0
    weight_throttle_slew: 50.0
    startup_nominal_throttle_seed: 0.25
    terminal_multiplier: 3.0
    max_steering_rad: 0.5235987756
    corridor_margin_m: 0.05
    # Restore this clearance reserve after disturbances; every published plan
    # must independently satisfy the physical walls, up to the far-stage
    # tolerance below.
    first_prediction_corridor_margin_m: 0.05
    # The publication check tolerates a wall violation that grows linearly from
    # zero at stage 12 to this value at the last stage: the next cycles re-plan
    # long before those stages are reached.
    publication_far_tolerance_m: 0.10
    publication_tolerance_start_stage: 12
    corridor_preview_halfwidth_m: 0.1
    nonlinear_corridor_tolerance_m: 0.0
    cycle_budget_ms: 22.0
    jacobian_threads: 6
    # One force substep per millisecond tick in the derivative passes: a
    # linearization stage below 5 m/s is three times cheaper.
    derivative_force_substeps: 1
    sqp_iterations: 16
    sqp_violation_penalty: 1000000.0
    sqp_accuracy_tolerance: 0.05
