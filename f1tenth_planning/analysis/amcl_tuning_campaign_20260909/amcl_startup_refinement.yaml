gpu_amcl_cpp:
  ros__parameters:
    # One-factor startup diagnostic.  The saved anchor is the simulator's
    # actual map-frame start, but the first global particle mode is currently
    # about 0.8 m away and is rejected.  Refine that initial cloud against the
    # first LiDAR scan before evaluating the existing lock gates.
    enable_startup_scan_refinement: true
    startup_scan_refinement_max_beams: 180
    startup_scan_refinement_iterations: 12
    startup_scan_refinement_max_match_distance_m: 0.60
    startup_scan_refinement_max_translation_m: 0.50
    startup_scan_refinement_max_yaw_rad: 0.52
