name: CPU validation

on:
  push:
  pull_request:

jobs:
  runtime-models-cpu:
    name: ROS 2 Humble odometry and MPC models
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Build without CUDA AMCL
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake libeigen3-dev nlohmann-json3-dev \
            ros-humble-ament-cmake-gtest
          colcon build --merge-install \
            --packages-up-to f1tenth_localization f1tenth_mpc \
            --cmake-args -DBUILD_GPU_AMCL=OFF
      - name: Run C++ tests
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          ctest --test-dir build/f1tenth_localization --output-on-failure
          ctest --test-dir build/f1tenth_mpc --output-on-failure
      - name: Check whitespace and syntax
        run: |
          git diff --check
          python3 -m compileall -q sdu_apex_autodrive/sdu_apex_autodrive sdu_apex_autodrive/launch

  raceline-optimizer:
    name: Raceline optimizer tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: raceline_optimizer/requirements.txt
      - name: Install dependencies
        run: pip install -r raceline_optimizer/requirements.txt
      - name: Run tests
        working-directory: raceline_optimizer
        run: python -m pytest -q
      - name: Check syntax of the Python tools
        run: python -m compileall -q tools raceline_optimizer
      - name: Check documentation links
        run: python -m pytest -q tools/tests/test_docs_links.py
