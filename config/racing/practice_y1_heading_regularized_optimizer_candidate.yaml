limits:
  min_body_speed_mps: 0.8
  # The prior matching-model practice screen was collision-free for one scored
  # lap with |CTE| p95 5.7 cm; the earlier failed candidate reached 0.426 rad
  # before corridor rejection. Bound the optimizer's heading state below that
  # observed failure region while retaining a soft cost for smoother margins.
  max_heading_error_rad: 0.35

track:
  prep_smoothing_s: 6.0
  extra_wall_clearance_m: 0.10
  optimizer_geometry_buffer_m: 0.04
  heading_aware_physical_footprint: true
  export_optimizer_nodes: true
  export_spacing_m: 0.02

lateral_envelope:
  speed_mps: [0.0, 5.5, 5.9, 6.0, 6.5, 6.9, 7.0, 16.0]
  steering_abs_rad: [0.0, 0.1, 0.15, 0.3, 0.42, 0.5235987756]
  ay_max_mps2:
    - [8.4, 8.4, 8.4, 8.4, 8.4, 8.4]
    - [8.4, 8.4, 8.4, 8.4, 8.4, 8.4]
    - [8.4, 8.4, 8.4, 8.4, 8.4, 8.4]
    - [8.8, 8.8, 8.4, 8.4, 8.4, 8.4]
    - [9.0, 9.0, 8.4, 8.4, 8.4, 8.4]
    - [8.52, 8.52, 8.4, 8.4, 8.4, 8.4]
    - [8.4, 8.4, 8.4, 8.4, 8.4, 8.4]
    - [8.4, 8.4, 8.4, 8.4, 8.4, 8.4]
  scale: 1.0
  source: "practice full-run r01: ten scored laps; uplift is confined to the observed 6-7 m/s, |steering|<0.10 rad region"

lateral_dynamics:
  use_odometry_lateral_velocity: true

combined_acceleration:
  enabled: true
  exponent: 2.0

vehicle_model_overrides:
  yaw_surface_csv: f1tenth_mpc/config/yaw_response_surface_y1.csv
  yaw_surface_speed_blend_margin_mps: 0.1
  yaw_surface_enabled: true
  yaw_surface_response_scale: 1.0
  yaw_surface_blend_q_start: 0.3
  yaw_surface_blend_q_end: 0.7
  yaw_surface_low_speed_blend_margin_mps: 0.1
  yaw_surface_low_speed_support_fadeout_mps: 0.0
  yaw_surface_high_speed_support_fadein_mps: 0.0
  yaw_surface_steering_blend_start_rad: 0.29
  yaw_surface_steering_blend_full_start_rad: 0.3
  yaw_surface_steering_blend_full_end_rad: 0.42
  yaw_surface_steering_blend_end_rad: 0.45

solver:
  mesh_schedule_m: [0.18]
  coarse_multistart: [solution_nodes]
  stop_after_first_coarse_success: true
  refinement_starts: [previous]
  stop_after_first_refinement_success: true
  allow_best_coarse_fallback: false
  coarse_max_iter: 1800
  refinement_max_iter: 1200
  tol: 1.0e-7
  acceptable_tol: 1.0e-5
  acceptable_iter: 15
  print_level: 0
  expand: true
  mu_strategy: adaptive
  linear_solver: mumps

scaling:
  ey_m: 0.5
  epsi_rad: 0.5
  u_mps: 10.0
  r_radps: 10.0
  target_mps: 10.0
  delta_rad: 0.5
  qdelta_radps: 3.2
  qv_mps2: 8.0

regularization:
  steering_rate: 1.0e-5
  target_speed_rate: 1.0e-6
  # The prior candidate's pre-failure heading error reached 0.426 rad while
  # safe laps remained below 0.04 rad. A weight of 0.5 adds only ~0.075 s
  # to the current solution's heading penalty integral before re-optimization.
  heading_error: 0.5

numerics:
  min_progress_mps: 0.30
  min_frenet_denominator: 0.25
