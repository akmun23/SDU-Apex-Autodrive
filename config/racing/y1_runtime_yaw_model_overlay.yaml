# Match the candidate plant to the same Y1 table loaded by mpc_competition.
# The optimizer must be invoked with --disable-yaw-phase-response so it also
# uses the runtime hold/transition constants instead of optimizer-only taus.
vehicle_model_overrides:
  yaw_surface_csv: f1tenth_mpc/config/yaw_response_surface_y1.csv
  yaw_surface_speed_blend_margin_mps: 0.10
  yaw_surface_low_speed_blend_margin_mps: 0.10
