autodrive_actuator_interface:
  ros__parameters:
    # Development-only event policy matching the replicated 6.5 m/s,
    # 0.08-rad, +0.08 throttle / 0.15-s intervention. The speed and steering
    # bounds are outward-rounded extrema across 16 valid exact-cell phases in
    # four independent train/validation captures; the increment is exact.
    throttle_rise_event_enabled: true
    throttle_rise_event_rate_per_sec: 0.5333333333333333
    throttle_rise_event_speed_min_mps: 6.5021
    throttle_rise_event_speed_max_mps: 6.5049
    throttle_rise_event_min_abs_steering_rad: 0.0742
    throttle_rise_event_max_abs_steering_rad: 0.0801
    throttle_rise_event_increment_min: 0.08
    throttle_rise_event_increment_max: 0.08
