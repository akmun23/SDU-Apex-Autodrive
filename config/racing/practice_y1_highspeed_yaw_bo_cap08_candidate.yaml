limits:
  min_body_speed_mps: 0.8
  max_heading_error_rad: 0.75

track:
  prep_smoothing_s: 6.0
  extra_wall_clearance_m: 0.10
  optimizer_geometry_buffer_m: 0.04
  heading_aware_physical_footprint: true
  export_optimizer_nodes: true
  export_spacing_m: 0.02

# Candidate-only calibration from exact-source Unity practice tests:
# the same optimized geometry completed with an 8.0 m/s^2 curvature envelope,
# while 8.5 m/s^2 produced front-tire slip and left the mapped course. This is
# not a production vehicle limit; the speed/steering table remains explicit.
lateral_envelope:
  speed_mps: [0.0, 5.5, 5.9, 6.0, 6.5, 6.9, 7.0, 16.0]
  steering_abs_rad: [0.0, 0.1, 0.15, 0.3, 0.42, 0.5235987756]
  ay_max_mps2:
    - [8.4, 8.4, 8.4, 8.4, 8.4, 8.4]
    - [8.4, 8.4, 8.4, 8.4, 8.4, 8.4]
    - [8.4, 8.4, 8.4, 8.4, 8.4, 8.4]
    - [8.8, 8.8, 8.4, 8.4, 8.4, 8.4]
    - [9.0, 9.0, 8.4, 8.4, 8.4, 8.4]
    - [8.52, 8.52, 8.4, 8.4, 8.4, 8.4]
    - [8.4, 8.4, 8.4, 8.4, 8.4, 8.4]
    - [8.4, 8.4, 8.4, 8.4, 8.4, 8.4]
  scale: 0.9523809524
  source: "Unity-screened candidate scale; not a universal vehicle limit"

lateral_dynamics:
  use_odometry_lateral_velocity: true

combined_acceleration:
  enabled: true
  exponent: 2.0

vehicle_model_overrides:
  yaw_surface_csv: live_runs/raceline_candidates/practice_y1_highspeed_yaw_bo_20261014/yaw_response_surface_combined.csv
  yaw_surface_blend_q_start: 0.30
  yaw_surface_blend_q_end: 0.70
  yaw_surface_speed_blend_margin_mps: 0.10
  yaw_surface_low_speed_blend_margin_mps: 0.60
  yaw_surface_low_speed_support_fadeout_mps: 0.0
  yaw_surface_high_speed_support_fadein_mps: 0.0
  yaw_surface_steering_blend_start_rad: 0.29
  yaw_surface_steering_blend_full_start_rad: 0.30
  yaw_surface_steering_blend_full_end_rad: 0.42
  yaw_surface_steering_blend_end_rad: 0.45

optimizer_constraints:
  max_steering_rad: 0.5235987756
  max_steering_rate_radps: 3.2

solver:
  mesh_schedule_m: [0.18]
  coarse_multistart: [solution_nodes, center]
  stop_after_first_coarse_success: true
  refinement_starts: [previous]
  stop_after_first_refinement_success: true
  allow_best_coarse_fallback: false
  coarse_max_iter: 6000
  refinement_max_iter: 6000
  tol: 1.0e-7
  # The tabulated envelope has interpolation kinks; the measured near-solution
  # satisfied constraints to <2e-6 but plateaued at 1.3e-3 dual infeasibility.
  acceptable_tol: 2.0e-3
  acceptable_iter: 15
  print_level: 0
  expand: true
  mu_strategy: adaptive
  linear_solver: mumps

scaling:
  ey_m: 0.5
  epsi_rad: 0.5
  u_mps: 10.0
  r_radps: 10.0
  target_mps: 10.0
  delta_rad: 0.5
  qdelta_radps: 3.2
  qv_mps2: 8.0

regularization:
  steering_rate: 1.0e-5
  target_speed_rate: 1.0e-6
  heading_error: 1.0e-6

numerics:
  min_progress_mps: 0.30
  min_frenet_denominator: 0.25
