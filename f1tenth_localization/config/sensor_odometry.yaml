sensor_odometry:
  ros__parameters:
    left_encoder_topic: /autodrive/roboracer_1/left_encoder
    right_encoder_topic: /autodrive/roboracer_1/right_encoder
    imu_topic: /autodrive/roboracer_1/imu
    odom_topic: /odom
    diagnostics_topic: /odom/diagnostics
    reset_enabled: false
    reset_topic: /autodrive/reset_command

    odom_frame: odom
    base_frame: base_link
    lidar_frame: lidar
    imu_frame: imu
    lidar_x_m: 0.2733
    lidar_y_m: 0.0
    lidar_z_m: 0.096
    imu_x_m: 0.08
    imu_y_m: 0.0
    imu_z_m: 0.055

    # Frozen deterministic observer constants from
    # VALIDATED_ODOMETRY_IMPLEMENTATION_HANDOFF.md.
    wheel_radius_m: 0.059
    reset_encoder_jump_rad: 50.0
    # Track-scene native telemetry is approximately 20 Hz (0.050 s). A
    # 0.040 s limit incorrectly marked every normal packet degraded and set
    # the pose covariance to 0.25 m^2, which stopped Pure Pursuit.
    normal_packet_dt_max_s: 0.080
    degraded_packet_dt_max_s: 0.100
    # Retain encoder displacement across short source gaps. Longer gaps are
    # rebaselined because an endpoint delta is no longer a safe motion sample.
    max_integratable_gap_s: 0.250
    decel_detect_ax_mps2: -0.5
    decel_ax_scale: 1.005
    decel_ax_offset_mps2: 0.020
    wheel_update_ax_abs_max_mps2: 0.6
    wheel_freeze_speed_mps: 0.15
    wheel_innovation_max_mps: 0.30
    # Separate true stopped detection from the 0.15 m/s missing-encoder gate;
    # mapping and low-speed driving are valid below that gate.
    stationary_speed_threshold_mps: 0.03
    wheel_update_beta: 0.20
    # Clear stale motion after sustained zero wheel motion and calm IMU data;
    # a single missing encoder packet is still rejected by the frozen-wheel
    # gate above.
    # Native source intervals are about 0.067 s in the compete player. A
    # 0.20 s hold let a stale 0.50 m/s prediction integrate for two packets
    # after the encoders had already reached zero. 0.10 s still requires a
    # second coherent zero packet while preventing that measured stop jump.
    stationary_hold_s: 0.10
    stationary_ax_abs_max_mps2: 0.25
    stationary_ay_abs_max_mps2: 0.75
    stationary_yaw_rate_abs_max_radps: 0.15
    turn_enter_yaw_rate_radps: 0.6
    turn_enter_abs_ay_mps2: 6.0
    turn_exit_yaw_rate_radps: 0.1
    turn_exit_abs_ay_mps2: 0.5
    turn_exit_hold_s: 0.5
    # Use the validated no-lateral-slip kinematic turn update. Integrating
    # simulator lateral IMU acceleration at 20 Hz caused false pose drift in
    # the first bend; enable only after a separately validated slip model.
    integrate_lateral_acceleration_in_turn: false
    # Reject impossible longitudinal IMU spikes before they can be integrated
    # into odometry. Lateral acceleration remains unconstrained here because
    # it is physically large in the tight track turns.
    max_imu_ax_abs_mps2: 30.0
    imu_orientation_correction_gain: 1.0
    max_imu_orientation_step_rad: 0.30
    max_pending_packets: 8

    pose_xy_variance: 0.01
    # A timing gap is handled by the EKF's source-time process term. Do not
    # inject a larger permanent floor for one packet: that would contaminate
    # the rest of the epoch even when the next packet is coherent.
    timing_degraded_pose_xy_variance: 0.01
    # The full-lap recorder showed sub-milliradian heading error. Keep a small
    # calibrated floor so it cannot project 0.01 rad^2 into metres of lateral
    # covariance over a long lap.
    pose_yaw_variance: 0.0001
    twist_linear_variance: 0.04
    twist_yaw_variance: 0.04

    # /odom/diagnostics is Float64MultiArray version 3:
    # version, source_stamp_s, dt_s, raw_wheel_mps, mapped_wheel_mps,
    # speed_pred_mps, speed_mps, body_u_mps, body_v_mps, ax_mps2, ay_mps2,
    # yaw_rate_radps, wheel_update_used, turn_mode, reset_epoch,
    # timing_degraded, packet_drop_count, packet_coherence_fault_count,
    # x_m, y_m, yaw_rad, sensor_outlier, left_angle_rad, right_angle_rad,
    # imu_yaw_rad. The last three values are the exact synchronized packet
    # inputs used by the observer and make offline replay source-time exact.
