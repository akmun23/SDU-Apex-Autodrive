ekf_localization:
  ros__parameters:
    # /odom is the raw deterministic encoder/IMU observer output. The trust
    # filter preserves its causal motion and supplies the covariance-bearing
    # stream consumed by AMCL.
    odom_topic: /odom
    output_topic: /ekf_pose
    output_odom_topic: /ekf_odom

    odom_frame: odom

    # Propagate every sensor-odometry sample in the local odom frame. This is
    # the conservative baseline to identify against ground truth before the
    # fitted encoder/IMU vehicle model is installed.
    process_noise_scale: 1.0
    # These are process-noise densities, not measurement noise copied from
    # the raw topic. They are deliberately explicit so replay tests can fit
    # and verify them against recorded truth.
    # The raw message covariance remains an initial/floor uncertainty and is
    # never added as process noise on every callback. The multi-stop
    # source-time campaign showed that XY error accumulated mainly with wall
    # time, including braking transients, so the time density below is fitted
    # separately from the distance density.
    process_noise_xy_m2_per_m: 0.000001
    # The newest real 2 m/s control recording fitted 2.95e-4 m^2/s and
    # retained 99.7% XY ellipse coverage on its chronological holdout.
    process_noise_xy_m2_per_s: 0.0003
    process_noise_yaw2_per_rad: 0.000001
    process_noise_yaw2_per_m: 0.000001
    # At the native 20 Hz track cadence even 23 m/s is about 1.15 m per
    # packet. A multi-metre jump is therefore an epoch/teleport, not a valid
    # motion sample. Keep this below the old 20 m value so a reset cannot be
    # converted into several apparently valid one-metre updates.
    max_odom_delta_m: 3.0

    # Enabled only by the finite open-ground identification suite. Production
    # runtime leaves this disabled; AMCL remains an independent map correction.
    reset_enabled: false
    reset_topic: /autodrive/reset_command
    publish_tf: false
