ekf_localization:
  ros__parameters:
    # Local filter only. /odom is generated from the official rear encoders
    # and IMU by sensor_odometry_node. AMCL is an independent map-frame
    # localization source and is deliberately not an EKF input.
    odom_topic: /odom
    output_topic: /ekf_pose

    odom_frame: odom

    # Propagate every sensor-odometry sample in the local odom frame. This is
    # the conservative baseline to identify against ground truth before the
    # fitted encoder/IMU vehicle model is installed.
    process_noise_scale: 1.0
    # Large enough for native bridge gaps at high speed. A frozen wheel
    # encoder while braking is not a discontinuity and never triggers reset.
    max_odom_delta_m: 20.0

    # Enabled only by the finite open-ground identification suite. Production
    # runtime leaves this disabled; AMCL remains an independent map correction.
    reset_enabled: false
    reset_topic: /autodrive/reset_command
