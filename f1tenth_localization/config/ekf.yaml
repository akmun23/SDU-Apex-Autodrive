ekf_localization:
  ros__parameters:
    # Team topics only. /odom is generated from official rear encoders + IMU.
    amcl_topic: /amcl_pose
    odom_topic: /odom
    output_topic: /ekf_pose

    global_frame: map
    odom_frame: odom
    base_frame: base_link
    transform_tolerance_s: 0.0

    # Predict from every odometry sample. Propagate delayed AMCL measurements
    # to the latest odom time before applying the map-frame correction.
    process_noise_scale: 1.0
    odom_history_duration_s: 0.75
    amcl_max_latency_s: 0.35

    # Keep odometry as the short-term pose source. AMCL corrects the map-frame
    # offset at a useful rate, but the covariance floor prevents one scan from
    # overwriting the encoder/IMU motion estimate at full weight.
    amcl_position_variance_floor: 0.15
    amcl_yaw_variance_floor: 0.06
    # Inflate only genuinely large innovations; ordinary track corrections
    # must still reach the fused pose in a few scan cycles.
    amcl_innovation_gate_distance_m: 0.30
    amcl_innovation_gate_yaw_rad: 0.12
    amcl_jump_reset_enabled: true
    amcl_jump_reset_distance_m: 1.0
    amcl_jump_reset_yaw_rad: 1.2
