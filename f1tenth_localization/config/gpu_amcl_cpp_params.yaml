gpu_amcl_cpp:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /autodrive/roboracer_1/lidar
    # AMCL consumes the timestamped trust-filter output. The raw /odom topic
    # remains available for diagnostics and offline odometry scoring.
    odom_topic: /ekf_odom

    num_particles: 2500
    min_particles: 1000
    max_particles: 2500
    use_kld_sampling: true
    kld_epsilon: 0.10
    kld_z: 1.96
    kld_bin_x: 0.05
    kld_bin_y: 0.05
    kld_bin_theta: 0.0523598776
    kld_min_bin_weight: 0.0

    # Do not re-localize on stationary scan noise. AMCL republishes its last
    # accepted pose while the vehicle has not moved, preventing drift between
    # motion updates while preserving the official simulator cadence.
    update_min_d: 0.02
    update_min_a: 0.035
    # Accept transport/scheduling delay without treating an old scan as live.
    # This remains valid for both the current 20 Hz compete player and a
    # validated 40 Hz player; AMCL never fabricates an intermediate scan.
    max_scan_age: 0.25
    # LiDAR callbacks can arrive behind the odometry timestamp. Keep a full
    # second so a scan delivered before its source-time odometry can wait for
    # the bracket instead of being paired with an old sample.
    odom_history_duration_s: 1.00
    # The EKF odom message already carries cumulative, calibrated source-time
    # covariance. Do not add a second arbitrary time-based covariance ramp to
    # an otherwise accurate map pose; nonzero values remain only as a fallback
    # for legacy odometry messages without a usable covariance.
    current_map_pose_process_xy_m2_per_s: 0.0
    current_map_pose_process_yaw2_per_s: 0.0
    localization_degraded_after_s: 0.30

    # The official bridge provides cumulative wheel angles plus IMU yaw. Keep
    # the motion model conservative so scan corrections do not let artificial
    # yaw noise dominate the local particle cloud.
    alpha1: 0.02
    alpha2: 0.05
    alpha3: 0.03
    alpha4: 0.05
    slip_angular_threshold: 1.0
    slip_noise_multiplier: 2.0

    max_beams: 270
    z_hit: 0.90
    z_rand: 0.10
    sigma_hit: 0.05
    laser_min_range: 0.06
    laser_max_range: 10.0
    laser_offset_x: 0.2733
    laser_offset_y: 0.0
    normalize_likelihood_by_beams: true
    likelihood_scale: 2.0
    resample_threshold: 0.50

    use_cluster_estimate: true
    cluster_xy_bin_m: 0.15
    cluster_radius_m: 0.35
    cluster_iterations: 3
    cluster_min_covariance: 0.0001
    # The current competition map and native simulator scan cadence converge
    # at roughly 0.20.  Keep this as a confidence floor, not a truth input;
    # the map/raceline distance, heading, covariance, and jump gates remain
    # active before a pose is published to the controller.
    cluster_publish_min_weight: 0.20

    enable_recovery_injection: false
    recovery_injection_ratio: 0.05
    enable_local_roughening: true
    local_roughening_ratio: 0.20
    local_roughening_xy_std_m: 0.12
    local_roughening_yaw_std_rad: 0.0872664626
    local_roughening_bad_log_weight_per_beam: -1.0
    local_roughening_max_cloud_std_m: 0.75

    enable_raycast_verification: false
    raycast_verification_global_only: true
    raycast_verification_max_clusters: 5
    raycast_verification_particles_per_cluster: 20
    raycast_verification_top_particles: 20
    raycast_verification_max_beams: 270
    raycast_verification_cluster_radius_m: 0.35
    raycast_verification_yaw_tolerance_rad: 0.5235987756
    raycast_verification_beta: 0.30
    raycast_verification_min_factor: 0.20
    raycast_verification_step_m: 0.05

    enable_startup_scan_refinement: false
    startup_scan_refinement_max_beams: 90
    startup_scan_refinement_iterations: 8
    startup_scan_refinement_max_match_distance_m: 0.60
    startup_scan_refinement_max_translation_m: 0.50
    startup_scan_refinement_max_yaw_rad: 0.52
    startup_scan_refinement_max_step_translation_m: 0.08
    startup_scan_refinement_max_step_yaw_rad: 0.06

    pose_jump_gate_enabled: true
    pose_jump_max_distance_m: 1.0
    pose_jump_max_yaw_rad: 1.2
    pose_jump_confirm_scans: 5
    pose_jump_confirm_distance_m: 0.75
    pose_jump_confirm_yaw_rad: 0.60

    # Keep AMCL odometry-dominant at the native scan cadence while
    # allowing real map corrections to arrive within a few scans. A larger
    # single-scan jump is still rejected as a corridor alias and replaced by
    # the causal odometry prediction.
    # A scan correction must be geometrically tiny as well as locally
    # associated. In the first live bend, the map scan mode repeatedly pulled
    # the controller away from the ground-truth path while odometry remained
    # within about 0.04 m. Tighten the innovation gate so that only the small
    # corrections expected from this 5 cm map are allowed into the local pose.
    local_scan_correction_max_distance_m: 0.04
    local_scan_correction_max_yaw_rad: 0.08
    # Associate local scan clusters with the causal odometry-predicted pose;
    # repeated corridor aliases outside this radius are not controller input.
    local_cluster_association_max_distance_m: 0.80
    # Moderate cluster weights are usable once the innovation gate above has
    # passed. Very weak modes remain rejected before they can affect the map
    # pose.
    local_cluster_min_weight: 0.60
    # Keep translational scan correction disabled: the current corridor scans
    # do not observe along-track translation reliably. Wall orientation still
    # contains useful heading information, so it is evaluated independently.
    local_scan_correction_xy_gain: 0.0
    # The offline yaw-only candidate was rejected by the held-out live run:
    # it accumulated about 0.55 m of map-pose error while EKF odometry stayed
    # near 0.05 m. Keep the parameter available for a future observability-
    # aware matcher, but do not apply PF yaw corrections in production.
    local_scan_correction_yaw_gain: 0.0
    # Recenter the local particle cloud on the fused pose after each accepted
    # scan. Without this, the cloud retains the previous scan mode and a small
    # matching bias is integrated again at every scan update.
    local_tracking_reinitialize_cloud: true
    # The known-start local cloud is a scan-matching prior, not a global
    # recovery distribution. Stationary and moving campaigns showed that the
    # old 0.04 m^2 spread kept multiple wall modes alive and produced large
    # local innovations; 0.01 m^2 kept the dominant mode continuous while
    # reducing the measured innovation p95 to about 0.025 m.
    local_tracking_cloud_covariance_xy: 0.01
    local_tracking_cloud_covariance_yaw: 0.01

    # The compete simulator reset is deterministic and the first trajectory
    # sample is the checked-in map-frame start pose. Starting globally lets a
    # visually similar corridor win with high confidence, which gives the
    # controller a valid-looking but physically wrong map association.
    # Initialize at the known start and keep scan matching local thereafter.
    global_initialization: false
    # The circuit has visually identical straight sections.  Race startup uses
    # the known first raceline waypoint as an acceptance anchor while global
    # particles still recover from a wrong initial pose guess.
    initial_pose_from_raceline: true
    initial_heading_from_raceline: true
    global_heading_cone_rad: 0.45
    global_track_margin_m: 0.15
    global_max_lateral_offset_m: 1.50
    global_heading_trajectory_file: ""
    global_heading_trajectory_package: f1tenth_planning
    # Fallback for direct AMCL launches. AMCL and PP must use the same
    # map-frame raceline; the old ICRA file runs in the opposite direction at
    # the simulator start.
    global_heading_trajectory_rel_path: trajectories/autodrive_track_ftg_commit_20260908_lap01_mintime_raceline.csv
    # Do not accept a global candidate until it meets the same safety envelope
    # required by the controller.  AMCL keeps refining while the vehicle is
    # stationary, so a wrong start guess cannot deadlock localization.
    global_pose_covariance_xy_max: 0.25
    global_pose_covariance_yaw_max: 0.12
    # The simulator reset pose is ~0.51 m from the first raceline sample while
    # still inside the measured track corridor. Keep a bounded startup margin
    # so AMCL can publish its first map pose instead of deadlocking the EKF and
    # lateral planner at the reset origin.
    global_pose_max_track_distance_m: 0.65
    global_pose_max_track_heading_error_rad: 0.45
    # The compete simulator reset returns the car to the known race start. AMCL
    # must therefore reject visually similar sections elsewhere on the closed
    # circuit during startup; otherwise the controller can align its seam to a
    # valid but physically wrong map location.
    global_start_anchor_enabled: true
    global_start_anchor_radius_m: 0.90

    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_a: 0.0
    initial_cov_xx: 0.50
    initial_cov_yy: 0.50
    initial_cov_aa: 0.20

    cloud_publish_rate: 1.0
    debug_pre_resample_particles: false
    force_max_particles_initial_sec: 2.0
    odom_reset_distance_m: 2.0
    odom_reset_yaw_rad: 1.5
