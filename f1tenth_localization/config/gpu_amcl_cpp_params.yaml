gpu_amcl_cpp:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /autodrive/roboracer_1/lidar
    # AMCL consumes the timestamped trust-filter output. The raw /odom topic
    # remains available for diagnostics and offline odometry scoring.
    odom_topic: /ekf_odom

    num_particles: 2500
    min_particles: 1000
    max_particles: 2500
    use_kld_sampling: true
    kld_epsilon: 0.10
    kld_z: 1.96
    kld_bin_x: 0.05
    kld_bin_y: 0.05
    kld_bin_theta: 0.0523598776
    kld_min_bin_weight: 0.0

    # Do not re-localize on stationary scan noise. AMCL republishes its last
    # accepted pose while the vehicle has not moved, preventing drift between
    # motion updates while preserving the official simulator cadence.
    update_min_d: 0.02
    update_min_a: 0.035
    # Accept transport/scheduling delay without treating an old scan as live.
    # This remains valid for both the current 20 Hz compete player and a
    # validated native-cadence player; AMCL never fabricates an intermediate scan.
    max_scan_age: 0.25
    # LiDAR callbacks can arrive behind the odometry timestamp. Keep a full
    # second so a scan delivered before its source-time odometry can wait for
    # the bracket instead of being paired with an old sample.
    odom_history_duration_s: 1.00
    # The EKF odom message already carries cumulative, calibrated source-time
    # covariance. Do not add a second arbitrary time-based covariance ramp to
    # an otherwise accurate map pose; nonzero values remain only as a fallback
    # for legacy odometry messages without a usable covariance.
    current_map_pose_process_xy_m2_per_s: 0.0
    current_map_pose_process_yaw2_per_s: 0.0
    localization_degraded_after_s: 0.30

    # The official bridge provides cumulative wheel angles plus IMU yaw. Keep
    # the motion model conservative so scan corrections do not let artificial
    # yaw noise dominate the local particle cloud.
    alpha1: 0.02
    alpha2: 0.05
    alpha3: 0.03
    alpha4: 0.05
    slip_angular_threshold: 1.0
    slip_noise_multiplier: 2.0

    max_beams: 270
    z_hit: 0.90
    z_rand: 0.10
    sigma_hit: 0.05
    laser_min_range: 0.06
    laser_max_range: 10.0
    laser_offset_x: 0.2733
    laser_offset_y: 0.0
    normalize_likelihood_by_beams: true
    likelihood_scale: 2.0
    resample_threshold: 0.50

    use_cluster_estimate: true
    cluster_xy_bin_m: 0.15
    cluster_radius_m: 0.35
    cluster_iterations: 3
    cluster_min_covariance: 0.0001
    # The current competition map and native simulator scan cadence converge
    # at roughly 0.20.  Keep this as a confidence floor, not a truth input;
    # the map/raceline distance, heading, covariance, and jump gates remain
    # active before a pose is published to the controller.
    cluster_publish_min_weight: 0.20

    # Keep the normal locked cloud local. Global AMCL handles startup
    # localization; after lock, do not inject map-wide recovery particles into
    # a closed track, because a visually similar corridor can move the racing
    # pose several metres away from the causal odometry prediction.
    enable_recovery_injection: false
    recovery_injection_ratio: 0.10
    enable_local_roughening: true
    local_roughening_ratio: 0.20
    local_roughening_xy_std_m: 0.12
    local_roughening_yaw_std_rad: 0.0872664626
    local_roughening_bad_log_weight_per_beam: -1.0
    local_roughening_max_cloud_std_m: 0.75

    # Use the map's ray geometry to verify local particle modes as well as
    # startup modes. The likelihood-field score alone produced high-scoring
    # but wrong corridor aliases in the fast recordings.
    enable_raycast_verification: true
    raycast_verification_global_only: false
    raycast_verification_max_clusters: 5
    raycast_verification_particles_per_cluster: 20
    raycast_verification_top_particles: 20
    raycast_verification_max_beams: 270
    raycast_verification_cluster_radius_m: 0.35
    raycast_verification_yaw_tolerance_rad: 0.5235987756
    raycast_verification_beta: 0.30
    raycast_verification_min_factor: 0.20
    raycast_verification_step_m: 0.05

    # The first global likelihood-field mode can be about 0.8 m from the
    # simulator spawn even when the saved anchor is correct. Refine the
    # startup cloud against the first scan so the existing anchor/travel gates
    # do not deadlock PP waiting for /current_map_pose.
    enable_startup_scan_refinement: true
    startup_scan_refinement_max_beams: 180
    startup_scan_refinement_iterations: 12
    startup_scan_refinement_max_match_distance_m: 0.60
    startup_scan_refinement_max_translation_m: 0.50
    startup_scan_refinement_max_yaw_rad: 0.52
    startup_scan_refinement_max_step_translation_m: 0.08
    startup_scan_refinement_max_step_yaw_rad: 0.06

    pose_jump_gate_enabled: true
    pose_jump_max_distance_m: 1.0
    pose_jump_max_yaw_rad: 1.2
    pose_jump_confirm_scans: 5
    pose_jump_confirm_distance_m: 0.75
    pose_jump_confirm_yaw_rad: 0.60

    # Do not cap the accumulated translational correction. AMCL must be able
    # to apply the correction supported by repeated scans; the causal local
    # cluster association and the 1 m pose-jump sanity gate remain the alias
    # protections.
    local_scan_correction_max_distance_m: 0.0
    local_scan_correction_max_yaw_rad: 0.0
    # Associate local scan clusters with the causal odometry-predicted pose;
    # repeated corridor aliases outside this radius are not controller input.
    local_cluster_association_max_distance_m: 0.80
    # Moderate cluster weights are usable once the innovation gate above has
    # passed. Very weak modes remain rejected before they can affect the map
    # pose.
    # The live acceptance traces separated stable local matches (typically
    # >=0.92) from the ambiguous upper-hairpin modes (0.73-0.90). Reject the
    # latter and continue from causal odometry until scan support improves.
    local_cluster_min_weight: 0.90
    local_tracking_recovery_after_rejected_scans: 3
    local_tracking_recovery_confirm_scans: 3
    local_tracking_recovery_min_cluster_weight: 0.80
    local_tracking_recovery_stability_distance_m: 0.35
    local_tracking_recovery_stability_yaw_rad: 0.25
    # Apply each accepted scan innovation continuously. The fast acceptance
    # recording showed that, once the causal prediction was at least 0.10 m
    # from GT, the accepted innovation pointed back toward GT in about 92% of
    # samples; 0.25 therefore left too much odometry drift to accumulate.
    # Validate the higher gain at real driving speed while retaining the
    # causal association and cluster-quality checks.
    local_scan_correction_xy_gain: 0.50
    # Apply each accepted scan innovation continuously. AMCL must be able to
    # remove accumulated odometry drift in both map axes; this is not a
    # lifetime correction budget. The accepted full-speed run showed that the
    # upper-hairpin ambiguity is specifically in the raceline-tangent
    # component, so only that component is attenuated below.
    local_scan_correction_cross_track_only: false
    # Keep continuous along-track drift correction enabled, but reduce the
    # ambiguous branch-pulling component to the value accepted in the 11.77
    # lap full-speed run. The normal component remains at full gain.
    local_scan_correction_along_track_gain: 0.25
    # Heading was already source-time stable in the crash run. Keep its map
    # correction conservative until a heading-observability campaign justifies
    # a larger value.
    local_scan_correction_yaw_gain: 0.0
    # Recenter the local particle cloud on the fused pose after each accepted
    # scan. Without this, the cloud retains the previous scan mode and a small
    # matching bias is integrated again at every scan update.
    local_tracking_reinitialize_cloud: true
    # The sqrt(.04) = 0.20 m local cloud retained the stable long-run result
    # (167 m at 3 m/s, 0.139 m current-map p95); tightening to .01 m^2 did not
    # improve that error and still collided during the first hairpin.
    local_tracking_cloud_covariance_xy: 0.04
    local_tracking_cloud_covariance_yaw: 0.01

    # The local odometry origin and generated map/raceline origin are
    # different frames. Do not hide that mismatch by seeding a cloud at the
    # first raceline waypoint; startup must be scan-supported and global.
    global_initialization: true
    initial_pose_from_raceline: false
    initial_heading_from_raceline: false
    global_heading_cone_rad: 0.45
    global_track_margin_m: 0.15
    global_max_lateral_offset_m: 1.50
    global_heading_trajectory_file: ""
    global_heading_trajectory_package: f1tenth_planning
    # Fallback for direct AMCL launches. AMCL and PP must use the same
    # map-frame raceline; the old ICRA file runs in the opposite direction at
    # the simulator start.
    global_heading_trajectory_rel_path: trajectories/autodrive_track_ftg_commit_20260909_025m_mintime_raceline.csv
    # Startup localization is scan-supported, but the deterministic simulator
    # spawn still needs its saved map-start prior to reject closed-track
    # aliases. The controller then uses the first-lap speed ramp while AMCL
    # confirms the moving pose.
    global_pose_covariance_xy_max: 0.25
    global_pose_covariance_yaw_max: 0.12
    # Keep a bounded track/heading envelope for startup candidates. A saved
    # map-start anchor disambiguates the opposite-looking corridors.
    global_pose_max_track_distance_m: 0.65
    global_pose_max_track_heading_error_rad: 0.45
    global_start_anchor_enabled: true
    global_start_anchor_radius_m: 0.75
    global_start_anchor_x_m: 0.8006
    global_start_anchor_y_m: 3.1583
    global_start_anchor_yaw_rad: -1.5707963267948966
    global_start_anchor_heading_tolerance_rad: 0.80
    # Do not lock a visually plausible closed-track alias from one scan.
    # Require repeated strong, stable scan support during the slow startup
    # localization phase before PP is allowed to use the pose.
    global_lock_confirm_scans: 5
    global_lock_stability_distance_m: 0.35
    global_lock_stability_yaw_rad: 0.25
    global_lock_min_cluster_weight: 0.50
    # Do not lock on stationary closed-track scan aliases. Require the car to
    # leave the spawn by a small odometry distance so moving scans can
    # disambiguate the corridor before AMCL hands the pose to the controller.
    global_lock_min_travel_m: 0.75
    # Odom yaw was unbiased in the GT campaign, while the corridor scan
    # likelihood had a repeatable heading offset. Use the saved map-start yaw
    # plus the odom delta for the global lock heading.
    global_lock_use_odom_heading: true
    # Use the saved map-start translation during the slow localization ramp;
    # LiDAR still validates the candidate and local scan corrections remain
    # responsible for correcting odometry drift after lock.
    global_lock_use_anchor_position: true

    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_a: 0.0
    initial_cov_xx: 0.50
    initial_cov_yy: 0.50
    initial_cov_aa: 0.20

    cloud_publish_rate: 1.0
    debug_pre_resample_particles: false
    force_max_particles_initial_sec: 2.0
    odom_reset_distance_m: 2.0
    odom_reset_yaw_rad: 1.5
