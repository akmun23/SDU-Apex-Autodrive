# One-factor E1 localization experiment.
#
# This file is not the production AMCL configuration.  It tests whether the
# full-speed scan correction is being overly attenuated along the raceline
# tangent.  It changes no simulator input or physics and remains legal because
# AMCL still consumes only LiDAR plus /ekf_odom.
gpu_amcl_cpp:
  ros__parameters:
    local_scan_correction_fast_speed_threshold_mps: 3.0
    local_scan_correction_fast_along_track_gain: 1.0
