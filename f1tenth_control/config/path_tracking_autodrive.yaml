pure_pursuit_node:
  ros__parameters:
    odom_topic: /odom
    # AMCL is the independent map-frame position source. /ekf_pose is local
    # odom-frame motion and is not consumed as a map-frame correction.
    pose_topic: /amcl_pose
    command_topic: /cmd/speed
    steering_feedback_topic: /autodrive/roboracer_1/steering
    path_frame: map
    command_frame: base_link
    trajectory_file: ""
    wheelbase: 0.324
    # Full AutoDRIVE simulator envelope. The raceline's own velocity column,
    # curvature and clearance regulation still determine the actual target at
    # each point; this removes the old project-wide 5.5 m/s ceiling.
    max_speed: 22.88
    min_lookahead: 0.35
    max_lookahead: 0.95
    lookahead_gain: 0.05
    # At the native odometry update cadence a high-speed update can traverse a
    # large fraction of the narrow section before the next command. Start
    # shedding speed as soon as the estimated pose moves off the line.
    cte_speed_factor: 1.50
    cte_speed_floor_ratio: 0.55
    max_lateral_accel: 6.50
    # Start requesting the lower speed before the actuator path reaches
    # the slow point; the effective value models simulator idle braking.
    speed_preview_distance: 4.0
    speed_profile_braking_decel: 1.50
    corridor_half_width_ref: 0.35
    corridor_speed_floor_ratio: 0.25
    # Permit real corner regulation when the node is deliberately capped at
    # low speed. Neutral/zero remains reserved for invalid state or a safety
    # stop; this floor only prevents tiny positive commands while recoverable.
    # Do not crawl through the tightest bend. At very low speed the available
    # yaw rate also becomes very low (r = v*tan(delta)/L), so a 0.40 m/s floor
    # can leave the car's heading behind even though the geometric steering
    # angle is within the actuator limit. Keep a recoverable rolling floor at
    # 0.80 m/s; invalid/off-track state still commands zero.
    min_regulated_speed: 0.80
    # Stop instead of continuing to drive when localization/path association
    # has clearly been lost. Smaller errors still use the rolling floor above.
    offtrack_stop_error_m: 0.75
    # Bounded curvature feed-forward reduces delivery turn-in lag without using
    # simulator pose or any non-competition state.
    # Standard additive curvature feed-forward.  The previous convex blend
    # suppressed steering at the tight apex when CTE was already small.
    curvature_feedforward_gain: 0.50
    # Add early turn-in from the lookahead path heading. Curvature feed-forward
    # alone was too weak at the first tight seam at the native source cadence.
    heading_error_gain: 0.30
    # Shift the lookahead target toward the wider side of the measured
    # raceline corridor by at most 10 cm in tight sections.
    wall_bias_gain: 0.25
    wall_bias_max_m: 0.10
    # The observed bend has negative yaw rate while turning negative. A
    # signed damping term would reduce the required turn-in there, so keep
    # this disabled until steering feedback is available on the official
    # command path.
    yaw_rate_damping: 0.0
    max_steering: 0.5236
    pose_timeout_s: 0.3
    odom_timeout_s: 0.3
    # Compensate the normal scan-to-state delivery gap using only /odom.
    state_extrapolation_max_s: 0.12
    # Kept as a nominal diagnostic value; Pure Pursuit is triggered by /odom.
    control_rate_hz: 20.0
    localization_covariance_xy_max: 0.25
    localization_covariance_yaw_max: 0.12
    localization_required_updates: 5
    # A source-cadence command must reach the next requested angle promptly. This
    # allows the simulated steering actuator to enter the bend promptly while
    # the absolute steering limit remains unchanged.
    # AutoDRIVE documented centre-steering rate limit.
    max_steering_rate: 3.2
    # Keep the proven acceleration envelope. Increasing this command
    # ramp made the first tight corner enter about 0.4 m/s faster and caused a
    # collision even though the path geometry remained aligned.
    max_accel_cmd: 3.0
    max_decel_cmd: 8.0
    steering_feedback_timeout_s: 0.25
    # Apply only a bounded same-direction lead; sign changes are handled by
    # the normal steering-rate limiter to avoid stale-feedback reversals.
    steering_feedback_lead_gain: 0.25

stanley_node:
  ros__parameters:
    odom_topic: /odom
    pose_topic: /amcl_pose
    lidar_topic: /autodrive/roboracer_1/lidar
    command_topic: /cmd/speed
    path_frame: map
    command_frame: base_link
    trajectory_file: ""
    wheelbase: 0.324
    max_speed: 1.0
    min_speed: 0.4
    max_steering: 0.5236
    max_steering_rate: 3.2
    # Stanley is also triggered by the official LiDAR event.
    control_rate: 10.0
    pose_timeout_s: 0.3
    odom_timeout_s: 0.3
    localization_covariance_xy_max: 0.25
    localization_covariance_yaw_max: 0.12
    localization_required_updates: 5
