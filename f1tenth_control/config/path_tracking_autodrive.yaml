pure_pursuit_node:
  ros__parameters:
    odom_topic: /odom
    # /amcl_pose is a scan-time measurement. Use the AMCL map->odom correction
    # propagated with the newest allowed-sensor odometry for control-time pose.
    pose_topic: /current_map_pose
    command_topic: /cmd/speed
    steering_feedback_topic: /autodrive/roboracer_1/steering
    path_frame: map
    command_frame: base_link
    trajectory_file: ""
    wheelbase: 0.324
    # Full AutoDRIVE simulator envelope. The first lap applies the explicit
    # startup ramp below; after that the raceline's velocity column, curvature
    # and clearance regulation determine the requested speed.
    max_speed: 22.88
    startup_speed_mps: 1.50
    startup_ramp_laps: 1.0
    # The 0.35--0.95 m range repeatedly reversed steering at the first
    # hairpin before the 3.2 rad/s actuator could follow it. A longer target
    # preview was tested for 90 s at 3 m/s and 45 s at 4 m/s without collision.
    min_lookahead: 0.75
    max_lookahead: 1.10
    lookahead_gain: 0.05
    # Keep the measured runtime envelope while tuning the path/controller
    # pair. These terms reduce demand before the steering actuator saturates;
    # they do not stop PP when CTE briefly grows.
    cte_speed_factor: 1.50
    cte_speed_floor_ratio: 0.55
    max_lateral_accel: 6.50
    speed_preview_distance: 4.0
    speed_profile_braking_decel: 1.50
    corridor_half_width_ref: 0.35
    # The mintime raceline already contains the vehicle-speed profile. Do not
    # add a second corridor-derived speed cap in the racing controller; keep
    # corridor geometry for lookahead/target bias and let the raceline
    # determine the requested speed.
    corridor_speed_floor_ratio: 1.0
    # Do not impose a rolling speed floor. The raceline and its regulation
    # terms may request any non-negative speed, including neutral when the
    # path or localization requires it.
    min_regulated_speed: 0.0
    # CTE can be temporarily large while pose and steering actuator feedback
    # catch up. Keep PP steering/recovery active instead of hard-stopping.
    # Set this above zero only for an explicitly supervised CTE stop.
    offtrack_stop_error_m: 0.0
    curvature_speed_factor: 0.1015252
    curvature_speed_floor_ratio: 0.52401066
    curvature_preview_factor: 1.6245233
    # Standard Pure Pursuit already contains the nominal curvature of a curved
    # raceline. Keep optional compensations off in the production baseline so
    # the optimizer's geometry is not double-counted or silently shifted.
    curvature_feedforward_gain: 0.0
    heading_error_gain: 0.0
    wall_bias_gain: 0.0
    wall_bias_max_m: 0.10
    # The observed bend has negative yaw rate while turning negative. A
    # signed damping term would reduce the required turn-in there, so keep
    # this disabled until steering feedback is available on the official
    # command path.
    yaw_rate_damping: 0.0
    max_steering: 0.5236
    pose_timeout_s: 0.3
    odom_timeout_s: 0.3
    # Compensate the normal scan-to-state delivery gap using only /odom.
    state_extrapolation_max_s: 0.12
    # Kept as a nominal diagnostic value; Pure Pursuit is triggered by /odom.
    control_rate_hz: 40.0
    localization_covariance_xy_max: 0.25
    localization_covariance_yaw_max: 0.12
    localization_required_updates: 5
    # A source-cadence command must reach the next requested angle promptly. This
    # allows the simulated steering actuator to enter the bend promptly while
    # the absolute steering limit remains unchanged.
    # AutoDRIVE documented centre-steering rate limit.
    max_steering_rate: 3.2
    # Keep the proven acceleration envelope. Increasing this command
    # ramp made the first tight corner enter about 0.4 m/s faster and caused a
    # collision even though the path geometry remained aligned.
    max_accel_cmd: 3.0
    max_decel_cmd: 8.0
    steering_feedback_timeout_s: 0.25
    # Apply a bounded lead from fresh measured steering feedback, including
    # sign reversals so measured servo lag does not carry the car through a
    # newly requested turn.
    steering_feedback_lead_gain: 0.25
    # Never turn a frame/heading mismatch at startup into a drive command.
    # The reset pose can be offset from the raceline laterally, but it must
    # have the correct travel direction.
    startup_path_max_distance_m: 0.80
    startup_path_heading_tolerance_rad: 0.75
