services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    image: sdu-apex-autodrive:humble
    container_name: sdu_apex_autodrive
    network_mode: host
    ipc: host
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - .:/workspace/src:rw
    stdin_open: true
    tty: true
    command: bash
