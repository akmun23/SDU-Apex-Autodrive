services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    image: sdu-apex-autodrive:humble
    container_name: sdu_apex_autodrive
    network_mode: host
    ipc: host
    privileged: true
    gpus: all
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      # Keep the base workspace idle.  The tracked start script overrides this
      # to start exactly one bridge and one controller before Unity connects.
      SDU_APEX_AUTOSTART: ${SDU_APEX_AUTOSTART:-0}
      SDU_APEX_CONTROLLER: ${SDU_APEX_CONTROLLER:-ftg}
      SDU_APEX_WITH_RVIZ: ${SDU_APEX_WITH_RVIZ:-false}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - .:/workspace/src:rw
    stdin_open: true
    tty: true
